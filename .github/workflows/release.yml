name: Release

# Release tags are unprefixed (2.18.0); "v*" remains only for the
# one-off v2.17.0.
on:
  push:
    tags: ["[0-9]*", "v*"]

env:
  GHCR_IMAGE: ghcr.io/aweber-imbi/imbi
  DOCKERHUB_IMAGE: aweber/imbi

jobs:
  build:
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags') && github.repository == 'AWeber-Imbi/imbi'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag for build args
        id: ref
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./container/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VITE_GIT_REF=${{ steps.ref.outputs.tag }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and whether it is the highest semver
        id: version
        run: |
          current="${GITHUB_REF#refs/tags/}"
          echo "tag=$current" >> "$GITHUB_OUTPUT"
          # Strip the legacy v prefix before comparing: "v" sorts above
          # digits, so v2.17.0 would otherwise outrank 2.18.0 forever.
          highest=$(git tag | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n 1)
          if [ "$highest" = "${current#v}" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest to GHCR
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags="-t ${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.tag }}"
          if [ "${{ steps.version.outputs.is_latest }}" = "true" ]; then
            tags="$tags -t ${{ env.GHCR_IMAGE }}:latest"
          fi
          docker buildx imagetools create $tags \
            $(printf '${{ env.GHCR_IMAGE }}@sha256:%s ' *)

      - name: Create and push manifest to DockerHub
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags="-t ${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.tag }}"
          if [ "${{ steps.version.outputs.is_latest }}" = "true" ]; then
            tags="$tags -t ${{ env.DOCKERHUB_IMAGE }}:latest"
          fi
          docker buildx imagetools create $tags \
            $(printf '${{ env.GHCR_IMAGE }}@sha256:%s ' *)

  build-dist:
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags') && github.repository == 'AWeber-Imbi/imbi'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: '3.14'
          enable-cache: true

      # `uv version --short` below reads only the ROOT pyproject, so on its
      # own it cannot tell whether the members agree with it. A member left
      # behind builds a wheel at the old version while the meta-package pins
      # the new one, and the release publishes something that cannot be
      # installed. Pipeline checks this on every PR too; this is the gate
      # that keeps it off PyPI.
      - name: Verify every member version is in lockstep
        run: scripts/bump-version.sh --check

      - name: Verify tag matches the package version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version=$(uv version --short)
          if [ "${tag#v}" != "$version" ]; then
            echo "Tag $tag does not match pyproject.toml version $version" >&2
            exit 1
          fi

      # The release body comes from the tag annotation (see the
      # github-release job), so a bad annotation silently produces a useless
      # release. Catch it here, in the job that finishes in under a minute,
      # rather than after the multi-arch image build. Read the tag through
      # the API so this works at the default checkout depth.
      #
      # Each of these three has shipped at least once: 2.26.1 was a
      # lightweight tag, 2.30.0 was annotated with nothing but "2.30.0", and
      # 2.29.2/2.29.3/2.29.4 lost every "## Fixes" heading to git tag's
      # default --cleanup=strip, which treats a leading # as a comment.
      - name: Verify the tag is annotated with release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          hint="See .claude/skills/release/SKILL.md; re-cut the tag with"
          hint="$hint 'git tag -a --cleanup=verbatim -F <notes> $tag'"

          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")
          if [ "$(jq -r .object.type <<<"$ref")" != tag ]; then
            echo "::error::$tag is a lightweight tag, so it carries no" \
              "release notes. $hint" >&2
            exit 1
          fi

          sha=$(jq -r .object.sha <<<"$ref")
          message=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" -q .message)

          bare=$(printf '%s' "$message" | tr -d '[:space:]')
          if [ -z "$bare" ] || [ "$bare" = "$tag" ] || [ "$bare" = "${tag#v}" ]; then
            echo "::error::$tag is annotated with nothing but its own" \
              "version. The annotation IS the release body. $hint" >&2
            exit 1
          fi

          if ! printf '%s\n' "$message" | grep -q '^#'; then
            echo "::error::$tag's annotation has no Markdown heading. Either" \
              "the notes were written without one, or --cleanup=verbatim was" \
              "omitted and git stripped every '## ...' line as a comment." \
              "$hint" >&2
            exit 1
          fi

      - name: Build
        run: uv build --all-packages

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build-dist
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish package
        # Intentionally pinned to the release/v1 branch rather than a SHA.
        # PyPA ship trusted-publishing fixes by rolling this branch forward,
        # and recommend tracking it instead of pinning a commit.
        # https://github.com/pypa/gh-action-pypi-publish#:~:text=release/v1
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Retry safety: a re-run (or re-pointed tag) after a partially
          # failed release must not fail on the dists that already made it
          # to PyPI.
          skip-existing: true

  # Publishing the GitHub release is the last step, not a manual afterthought:
  # it has been forgotten before. Gated on merge and publish-pypi so a release
  # only ever announces artifacts that are actually live. Both upstream jobs
  # already carry the repository guard, and a skipped need skips this job, so
  # it needs no `if:` of its own.
  github-release:
    needs: [merge, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          # --notes-from-tag reads the annotation out of LOCAL git ("cannot
          # generate release notes from tag X as it does not exist locally"),
          # so the annotated tag object has to be fetched.
          fetch-depth: 0

      # fetch-depth: 0 is necessary but NOT sufficient. actions/checkout
      # fetches the annotated tag correctly and then force-fetches the
      # resolved COMMIT over it:
      #
      #   * [new tag]    2.31.0 -> 2.31.0                  # annotated object
      #   git fetch --no-tags --prune origin +<sha>:refs/tags/2.31.0
      #   t [tag update] <sha>  -> 2.31.0                  # now lightweight
      #
      # A lightweight tag has no annotation, so `gh --notes-from-tag` falls
      # back to %(contents) of the commit and publishes the commit message as
      # the release body. 2.31.0 shipped with "Bump version to 2.31.0" as its
      # notes and had to be repaired by hand. Re-fetch the real tag object,
      # then refuse to publish rather than announcing a commit subject.
      - name: Restore the annotated tag object
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          if [ "$(git cat-file -t "$tag")" != tag ]; then
            echo "::error::refs/tags/$tag is not an annotated tag object in" \
              "the local clone, so the release body would be the commit" \
              "message rather than the release notes. See" \
              ".claude/skills/release/SKILL.md." >&2
            exit 1
          fi

      - name: Resolve tag and whether it is the highest semver
        id: version
        run: |
          current="${GITHUB_REF#refs/tags/}"
          echo "tag=$current" >> "$GITHUB_OUTPUT"
          # Strip the legacy v prefix before comparing: "v" sorts above
          # digits, so v2.17.0 would otherwise outrank 2.18.0 forever.
          highest=$(git tag | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n 1)
          if [ "$highest" = "${current#v}" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the release from the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          IS_LATEST: ${{ steps.version.outputs.is_latest }}
        run: |
          # Idempotent so a re-run of a partially failed release is safe, and
          # so this can never collide with a release created by hand.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do"
            exit 0
          fi
          # No --repo: gh resolves the repo from the checked-out remote, which
          # is also the git context --notes-from-tag reads the annotation from.
          # --latest comes from the same comparison that decides the image's
          # :latest tag, so the two always agree. Left to gh, it would be
          # guessed from the date and would wrongly promote a patch cut on an
          # older line.
          gh release create "$TAG" \
            --verify-tag \
            --notes-from-tag \
            --title "$TAG" \
            --latest="$IS_LATEST"

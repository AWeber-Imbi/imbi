name: "Pipeline"
on:
  push:
    branches:
      - "main"
  pull_request:
# Every job here only checks out and reads the tree -- nothing pushes an
# image, publishes a package, or writes back to the repo. Declared at the
# workflow level so a new job cannot silently inherit repository-default
# write scopes.
permissions:
  contents: read
jobs:
  ci:
    name: "CI"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
        with:
          fetch-depth: 0
          filter: "blob:none"
          # moon ci only builds/tests (no push), so the token is not needed
          # after checkout; don't persist it in .git/config for later steps.
          persist-credentials: false
      # root:services builds the relational test template with
      # schemata/scripts/schema.sh. Its deploy runs pg_dump, which must
      # not be older than the server, and it needs the pinned pglifecycle
      # build. The cache key is the key of the Schema job, so the two jobs
      # share one build.
      - name: "Install the PostgreSQL 18 client"
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - uses: "actions/cache@v4"
        with:
          path: "~/.cache/imbi/pglifecycle"
          key: "pglifecycle-${{ runner.os }}-${{ hashFiles('schemata/scripts/install-pglifecycle.sh') }}"
      - name: "Install pglifecycle"
        run: |
          binary=$(schemata/scripts/install-pglifecycle.sh)
          "$binary" --version
      # moon's unstable_uv toolchain installs uv, but with python left
      # unmanaged the `uv venv` env-setup step races ahead of that install
      # and fails with "uv: command not found" on fresh runners. Provision
      # uv on PATH first so it is available before `moon ci` runs any task.
      - uses: "astral-sh/setup-uv@v5"
        with:
          version: "0.11.13"
      - uses: "moonrepo/setup-toolchain@v0"
      - run: "moon ci"
  versions:
    # Lockstep drift is silently committable and ships broken: uv lock
    # accepts a member whose version disagrees with the meta-package's
    # exact pin on it, and release.yml only compares the tag to the ROOT
    # version. The published meta-package then pins a member version that
    # never reached PyPI, so `pip install imbi==<tag>` cannot resolve --
    # and nothing notices until a user tries it. Catch it on the PR.
    #
    # Deliberately toolchain-free (perl + jq + coreutils only, no uv or
    # npm) so it reports in seconds rather than waiting on `moon ci`.
    name: "Versions"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
        with:
          persist-credentials: false
      - run: "scripts/bump-version.sh --check"
  schema:
    # Deploys schemata/ into a new database on the production Postgres
    # image, checks that a second deploy has only the allowlisted
    # statements, and runs the pgTAP files (root:schema-check). The
    # pglifecycle build is pinned to one commit (execution plan D27); the
    # cache key follows the install script, which holds the pin.
    name: "Schema"
    runs-on: "ubuntu-latest"
    services:
      postgres:
        image: "ghcr.io/aweber-imbi/postgres:latest"
        env:
          POSTGRES_PASSWORD: "secret"
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: "localhost"
      PGPORT: "5432"
      PGUSER: "postgres"
      PGPASSWORD: "secret"
    steps:
      - uses: "actions/checkout@v4"
        with:
          persist-credentials: false
      # deploy runs pg_dump, which must not be older than the server.
      - name: "Install the PostgreSQL 18 client"
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - uses: "actions/cache@v4"
        with:
          path: "~/.cache/imbi/pglifecycle"
          key: "pglifecycle-${{ runner.os }}-${{ hashFiles('schemata/scripts/install-pglifecycle.sh') }}"
      - name: "Install pglifecycle"
        run: |
          binary=$(schemata/scripts/install-pglifecycle.sh)
          "$binary" --version
          sha256sum "$binary"
      - name: "Create the roles"
        run: >-
          psql -X -v ON_ERROR_STOP=1 -d postgres
          -v app_password=secret -v admin_password=secret
          -v maintenance_password=secret
          -f schemata/scripts/create-roles.sql
      # The script of root:schema-check, called directly: in CI, moon runs
      # no task with runInCI false, and runInCI true would add the task
      # to `moon ci` in the CI job, which has no PostgreSQL 18 client.
      - run: "schemata/scripts/schema.sh check"
  image:
    # Exercises the same docker/build-push-action configuration as
    # release.yml (single arch, no push) so drift in the build context,
    # Dockerfile path, or build args fails here instead of on a release tag.
    name: "Image"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
        with:
          persist-credentials: false
      - uses: "docker/setup-buildx-action@v3"
      - uses: "docker/build-push-action@v6"
        with:
          context: .
          file: ./container/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            VITE_GIT_REF=${{ github.sha }}
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64

name: "Pipeline"
on:
  push:
    branches:
      - "main"
  pull_request:
# Every job here only checks out and reads the tree -- nothing pushes an
# image, publishes a package, or writes back to the repo. Declared at the
# workflow level so a new job cannot silently inherit repository-default
# write scopes.
permissions:
  contents: read
env:
  # On a pull request, the base that the change is diffed against:
  # root:coverage runs only the tests of the affected members
  # (scripts/ci-test.sh), and the Changes job gates the jobs below.
  # Empty on a push to main, which runs everything. HEAD is the merge
  # into the current base, so HEAD^1 is that base. base.sha can be
  # older: a diff from it also lists what main merged since.
  IMBI_TEST_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
jobs:
  ci:
    name: "CI"
    # The tests run with pytest -n auto, so more cores make this job faster.
    runs-on: "blacksmith-16vcpu-ubuntu-2404"
    steps:
      - uses: "actions/checkout@v7"
        with:
          fetch-depth: 0
          filter: "blob:none"
          # moon ci only builds/tests (no push), so the token is not needed
          # after checkout; don't persist it in .git/config for later steps.
          persist-credentials: false
      # moon's unstable_uv toolchain installs uv, but with python left
      # unmanaged the `uv venv` env-setup step races ahead of that install
      # and fails with "uv: command not found" on fresh runners. Provision
      # uv on PATH first so it is available before `moon ci` runs any task.
      - uses: "astral-sh/setup-uv@v9.0.0"
        with:
          # 0.13.5+: no eMudhra root in uv's bundled CA store.
          version: "0.13.5"
      - uses: "moonrepo/setup-toolchain@v0"
      - run: "moon ci"
        env:
          # apache-iggy ships as an sdist only, and it makes some lints
          # errors. Cap lints at warnings, as container/Dockerfile does,
          # so a deprecation in a newer stable Rust does not stop uv sync.
          RUSTFLAGS: "--cap-lints=warn"
  changes:
    # Path gates for the jobs below. On a push to main, Image and
    # Harness isolation always run: the Image job writes the build
    # cache that release.yml reads. Proxy diffs a push against the
    # commit before it.
    name: "Changes"
    runs-on: "ubuntu-latest"
    outputs:
      image: ${{ steps.diff.outputs.image }}
      harness: ${{ steps.diff.outputs.harness }}
      proxy: ${{ steps.diff.outputs.proxy }}
    steps:
      - uses: "actions/checkout@v7"
        with:
          fetch-depth: 0
          filter: "blob:none"
          persist-credentials: false
      - id: "diff"
        env:
          BASE: ${{ env.IMBI_TEST_BASE }}
          BEFORE: ${{ github.event.before }}
        run: |
          # True when a file under one of the given paths changed, or
          # when this is not a pull request.
          changed() {
            if [ -z "$BASE" ] || ! git diff --quiet "$BASE"...HEAD -- "$@"; then
              echo true
            else
              echo false
            fi
          }
          shared=(.github/workflows/test.yml .dockerignore uv.lock pyproject.toml README.md LICENSE ':(glob)**/pyproject.toml')
          # The UI build configuration runs again in the Docker build,
          # which has no .git, so a change to it rebuilds the image.
          ui=(ui/package.json ui/package-lock.json ui/.npmrc ui/vite.config.ts ui/index.html 'ui/tsconfig*.json')
          echo "image=$(changed "${shared[@]}" container "${ui[@]}")" >> "$GITHUB_OUTPUT"
          echo "harness=$(changed "${shared[@]}" apps/harness helm/imbi-harness proxy)" >> "$GITHUB_OUTPUT"
          # A base that git cannot read (a new branch) counts as changed.
          if git diff --quiet "${BASE:-$BEFORE}" HEAD -- proxy .moon .github/workflows/test.yml; then
            echo "proxy=false" >> "$GITHUB_OUTPUT"
          else
            echo "proxy=true" >> "$GITHUB_OUTPUT"
          fi
  versions:
    # Lockstep drift is silently committable and ships broken: uv lock
    # accepts a member whose version disagrees with the meta-package's
    # exact pin on it, and release.yml only compares the tag to the ROOT
    # version. The published meta-package then pins a member version that
    # never reached PyPI, so `pip install imbi==<tag>` cannot resolve --
    # and nothing notices until a user tries it. Catch it on the PR.
    #
    # Deliberately toolchain-free (perl + jq + coreutils only, no uv or
    # npm) so it reports in seconds rather than waiting on `moon ci`.
    name: "Versions"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
        with:
          persist-credentials: false
      - run: "scripts/bump-version.sh --check"
  image:
    # Exercises the same docker/build-push-action configuration as
    # release.yml (single arch, no push) so drift in the build context,
    # Dockerfile path, or build args fails here instead of on a release tag.
    name: "Image"
    needs: "changes"
    # Source changes cannot break the build steps; moon ci builds the UI.
    if: needs.changes.outputs.image == 'true'
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
        with:
          persist-credentials: false
      - uses: "docker/setup-buildx-action@v4"
      - uses: "docker/build-push-action@v7"
        with:
          context: .
          file: ./container/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            VITE_GIT_REF=${{ github.sha }}
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64
  harness-isolation:
    # The P5a gate of the agent harness (ADR 0022): the runner pod in a kind
    # cluster, with the pod security settings of production, against a fake
    # imbi-api and model (apps/harness/isolation/fake_api.py). The real
    # imbi-api needs Postgres with AGE, ClickHouse, Iggy, and Valkey, and
    # its fake secret provider keeps values in process memory only.
    name: "Harness isolation"
    needs: "changes"
    if: needs.changes.outputs.harness == 'true'
    runs-on: "blacksmith-4vcpu-ubuntu-2404"
    steps:
      - uses: "actions/checkout@v7"
        with:
          persist-credentials: false
      # Keeps the BuildKit state between runs, including the cargo cache
      # mounts of proxy/Dockerfile. The type=gha cache of the Image job
      # does not keep cache mounts, so it cannot do this. Without it,
      # every run compiles the proxy from scratch. Fork PRs get their own
      # cache, so they cannot put layers into the cache of trusted runs.
      - uses: "useblacksmith/setup-docker-builder@v2"
        with:
          cache-key: harness-isolation-${{ github.event.pull_request.head.repo.fork && 'fork' || 'trusted' }}
      - uses: "helm/kind-action@v1"
        with:
          version: "v0.30.0"
          install_only: true
      # The released runner image (release.yml) must hold no setuid or
      # setgid file (P5a). The kind run below reuses these layers.
      - name: "Check the runtime image has no setuid or setgid files"
        run: |
          docker build --load -f apps/harness/Dockerfile --target runtime \
            -t imbi-harness:runtime .
          found=$(docker run --rm --entrypoint find imbi-harness:runtime \
            / -xdev -perm /6000 -type f)
          if [ -n "$found" ]; then
            echo "::error::setuid or setgid files in the runner image:" >&2
            echo "$found" >&2
            exit 1
          fi
      - run: "apps/harness/isolation/run-kind.sh"
  proxy:
    # The Rust egress proxy (proxy/). `moon ci` above does not run its
    # tasks (runInCI: false), so the Python job needs no Rust. Like
    # `moon ci`, it runs only for a change that can affect it.
    name: "Proxy"
    needs: "changes"
    if: needs.changes.outputs.proxy == 'true'
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the version.
      - working-directory: "proxy"
        run: "rustup toolchain install"
      - uses: "Swatinem/rust-cache@v2"
        with:
          workspaces: "proxy"
      # install-action installs prebuilt binaries, not a cargo build.
      - uses: "taiki-e/install-action@v2"
        with:
          tool: "cargo-deny"
      # The same commands as the proxy moon tasks. In CI, `moon run`
      # finds no task with runInCI: false, so call cargo directly.
      - working-directory: "proxy"
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo deny check
  proxy-fuzz:
    # Plan 12.5, X3: 60 seconds of each fuzz target. cargo fuzz needs
    # the nightly toolchain.
    name: "Proxy fuzz"
    needs: "proxy"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
        with:
          persist-credentials: false
      - run: "rustup toolchain install nightly --profile minimal"
      - uses: "Swatinem/rust-cache@v2"
        with:
          workspaces: "proxy/fuzz"
          key: "fuzz"
      - uses: "taiki-e/install-action@v2"
        with:
          tool: "cargo-fuzz"
      # The prebuilt cargo-fuzz is a musl binary, so its default target
      # is musl, which ASan does not support. Set the gnu target.
      - run: |
          proxy/fuzz/seed.sh
          for target in parse target; do
            cargo +nightly fuzz run --fuzz-dir proxy/fuzz \
              --target x86_64-unknown-linux-gnu "$target" -- \
              -max_total_time=60
          done

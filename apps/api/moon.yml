# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
layer: 'application'
stack: 'backend'
language: 'python'
tags:
  - 'python'

project:
  name: 'imbi-api'
  description: 'Imbi API service (:8000)'

dependsOn:
  - 'common'
  # The tests import these plugins.
  - id: 'github'
    scope: 'development'
  - id: 'aws'
    scope: 'development'
  - id: 'sentry'
    scope: 'development'
  - id: 'sonarqube'
    scope: 'development'

# Inherits lint / format / typecheck / test from .moon/tasks/python.yml. The
# shared test task points --cov-config at this member's pyproject, where
# [tool.coverage] scopes source + threshold to the member.
tasks:
  test:
    args:
      - '--cov'
      - '--cov-report=term-missing'

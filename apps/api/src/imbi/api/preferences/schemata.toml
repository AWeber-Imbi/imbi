# Relational schema for per-user UI preferences (Slack App Home PRD).
#
# imbi-api applies it on startup. People are referred to by email,
# because the API addresses users by email. `DELETE /users/{email}`
# deletes the rows of the user. The schema name is fixed: `preferences`.

# `value` is the JSON of the pydantic model of the namespace. `version`
# increases by 1 on each write (optimistic concurrency).
[[tables]]
name = "user_preferences"

[tables.columns]
email = "TEXT NOT NULL"
namespace = "TEXT NOT NULL"
value = "JSONB NOT NULL"
version = "INTEGER NOT NULL DEFAULT 1"
updated_at = "TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW()"

[tables.primary_key]
columns = ["email", "namespace"]

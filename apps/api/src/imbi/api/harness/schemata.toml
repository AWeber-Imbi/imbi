# Relational schema for the runner pool and dispatch (ADR 0022).
#
# The initializer (imbi.common.relational) walks this file and issues
# idempotent DDL, like the `agent_runtime` schema. Rows refer to graph
# nodes (organization, service account) by id or slug, and to agent
# tasks by their `agent_runtime.tasks` id.
#
# The schema name is fixed: `harness`.

# One row per runner pool. The Kubernetes Deployment of the pool has the
# same name. `organization_ids` is the allowlist; empty means all
# organizations. `service_account_id` is the immutable id of the service
# account whose client credential (the pool credential) registers
# runners; registration compares it, so a new service account with the
# slug of a deleted one cannot register. `service_account` is its slug,
# for display. A pool made before the id column has no id and refuses
# every registration until an update sets the service account again.
[[tables]]
name = "pools"

[tables.columns]
name = "TEXT NOT NULL"
description = "TEXT"
labels = "TEXT[] NOT NULL DEFAULT '{}'"
organization_ids = "TEXT[] NOT NULL DEFAULT '{}'"
service_account = "TEXT NOT NULL"
service_account_id = "TEXT"
created_at = "TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW()"
updated_at = "TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW()"

[tables.primary_key]
columns = ["name"]

# One row per registered runner (one pod). `state` is `idle`, `busy`,
# `offline`, or `fenced`: a busy runner whose lease expired is `fenced`
# until its chain is back in the queue, then `offline`. The runner and
# executor credentials are stored only as SHA-256 hashes; they have 256
# random bits, so no key or salt is needed.
[[tables]]
name = "runners"

[tables.columns]
id = "UUID NOT NULL"
pool = "TEXT NOT NULL REFERENCES harness.pools (name) ON DELETE CASCADE"
instance = "TEXT"
state = "TEXT NOT NULL DEFAULT 'idle'"
chain_id = "UUID"
image_version = "TEXT"
runner_token_hash = "TEXT NOT NULL"
executor_token_hash = "TEXT NOT NULL"
registered_at = "TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW()"
last_heartbeat = "TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW()"
lease_expires_at = "TIMESTAMP WITH TIME ZONE NOT NULL"
offline_at = "TIMESTAMP WITH TIME ZONE"

[tables.primary_key]
columns = ["id"]

[[tables.indexes]]
name = "runners_runner_token_key"
columns = ["runner_token_hash"]
unique = true

[[tables.indexes]]
name = "runners_executor_token_key"
columns = ["executor_token_hash"]
unique = true

[[tables.indexes]]
name = "runners_state_lease_idx"
columns = ["state", "lease_expires_at"]

# One row per chain that a runner claimed: the chain pin. The key is
# the id of the root task. `attempt` goes up when the runner is lost, so
# the agent tokens of the old attempt stop working at once.
#
# `state`:
#   running  pinned to `runner_id`
#   fencing  the runner is lost; the fencers run, then the grace period
#   stuck    a fencer failed; the sweep tries again each round
#   queued   back in the queue; the next claim pins it again
#   done     every task is closed
[[tables]]
name = "chains"

[tables.columns]
root_task_id = "UUID NOT NULL REFERENCES agent_runtime.tasks (id) ON DELETE CASCADE"
organization_id = "TEXT NOT NULL"
runner_id = "UUID REFERENCES harness.runners (id) ON DELETE SET NULL"
attempt = "INTEGER NOT NULL DEFAULT 1"
state = "TEXT NOT NULL DEFAULT 'running'"
claimed_at = "TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW()"
fenced_at = "TIMESTAMP WITH TIME ZONE"
fencers_ok_at = "TIMESTAMP WITH TIME ZONE"
fence_error = "TEXT"
updated_at = "TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW()"

[tables.primary_key]
columns = ["root_task_id"]

[[tables.indexes]]
name = "chains_state_idx"
columns = ["state"]

# The tasks that a runner claimed in each attempt of a chain, so that a
# claim never returns a task two times in one attempt.
[[tables]]
name = "claims"

[tables.columns]
task_id = "UUID NOT NULL REFERENCES agent_runtime.tasks (id) ON DELETE CASCADE"
attempt = "INTEGER NOT NULL"
chain_id = "UUID NOT NULL"
runner_id = "UUID NOT NULL"
claimed_at = "TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW()"

[tables.primary_key]
columns = ["task_id", "attempt"]

# Tool call counters for `AgentToolConfig.rate_limit`, across all
# runners. One row per agent, tool, period, and window start.
[[tables]]
name = "tool_call_counts"

[tables.columns]
agent_id = "TEXT NOT NULL"
tool_key = "TEXT NOT NULL"
period = "TEXT NOT NULL"
window_start = "TIMESTAMP WITH TIME ZONE NOT NULL"
count = "INTEGER NOT NULL"

[tables.primary_key]
columns = ["agent_id", "tool_key", "period", "window_start"]

# The agent platform configuration of an organization (ADR 0022). Each
# change writes a new version; a task pins the newest version when it
# is made (`agent_runtime.tasks.platform_config_version`).
[[tables]]
name = "platform_configs"

[tables.columns]
organization_id = "TEXT NOT NULL"
version = "INTEGER NOT NULL"
config = "JSONB NOT NULL"
created_by = "TEXT NOT NULL"
created_at = "TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW()"

[tables.primary_key]
columns = ["organization_id", "version"]

# A Claude Code plugin marketplace that an organization registered by
# git URL. The sync reads `.claude-plugin/marketplace.json` at the head
# of the default branch and stores the plugin catalog in `plugins`.
# `name` is the name in marketplace.json. A failed sync keeps the last
# catalog and sets `sync_error`.
[[tables]]
name = "marketplaces"

[tables.columns]
id = "UUID NOT NULL"
organization_id = "TEXT NOT NULL"
slug = "TEXT NOT NULL"
url = "TEXT NOT NULL"
name = "TEXT"
description = "TEXT"
default_branch = "TEXT"
head_sha = "TEXT"
plugins = "JSONB NOT NULL DEFAULT '[]'"
synced_at = "TIMESTAMP WITH TIME ZONE"
sync_error = "TEXT"
created_by = "TEXT NOT NULL"
created_at = "TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW()"
updated_at = "TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW()"

[tables.primary_key]
columns = ["id"]

[[tables.indexes]]
name = "marketplaces_organization_slug_key"
columns = ["organization_id", "slug"]
unique = true

[project]
name = "imbi-workflows"
version = "2.37.0"
description = "Imbi workflow engine"
readme = "README.md"
requires-python = ">=3.14"
license = "BSD-3-Clause"
authors = [
  { name = "Gavin M. Roy", email = "gavinr@aweber.com" },
]
classifiers = []
dependencies = [
  "fastapi>=0.135.1,<0.137",
  "httpx>=0.28.1",
  "imbi-common[databases,server]==2.37.0",
  "psycopg[binary,pool]~=3.3.2",
  "pydantic~=2.12",
]

[project.scripts]
imbi-workflows = "imbi.workflows.app:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Coverage for the per-member `moon run workflows:test` run. Scoped to this
# member so the report/threshold reflect only imbi.workflows; the aggregate
# `root:coverage` run uses the root pyproject config instead.
[tool.coverage.run]
branch = true
source_pkgs = ["imbi.workflows"]

[tool.coverage.report]
exclude_also = ["typing.TYPE_CHECKING"]
fail_under = 85
show_missing = true

[tool.hatch.build.targets.wheel]
packages = ["src/imbi"]
include = ["src/imbi/workflows/py.typed"]

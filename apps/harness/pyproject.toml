[project]
name = "imbi-harness"
version = "2.37.0"
description = "Imbi agent runner and executor"
readme = "README.md"
requires-python = ">=3.14"
license = "BSD-3-Clause"
authors = [
  { name = "Gavin M. Roy", email = "gavinr@aweber.com" },
]
classifiers = []
# No imbi-common: the runner image must stay small and must not hold the
# platform's database and queue clients.
dependencies = [
  "claude-agent-sdk>=0.2.150",
  "httpx>=0.28.1",
]

[project.scripts]
imbi-harness = "imbi.harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Coverage for the per-member `moon run harness:test` run. The user
# switches, the process start, and the SDK session need Linux, uid 0, and
# the pod layout. The kind suite in isolation/ covers them, not this unit
# suite, so the threshold is lower than for the other members.
[tool.coverage.run]
branch = true
source_pkgs = ["imbi.harness"]

[tool.coverage.report]
exclude_also = ["typing.TYPE_CHECKING"]
fail_under = 70
show_missing = true

[tool.hatch.build.targets.wheel]
packages = ["src/imbi"]
include = ["src/imbi/harness/py.typed"]

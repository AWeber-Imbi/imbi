# The P5a test pod (harness plan section 6.1) and the fake API, for kind.
# The credentials here are test values for the fake API (a test double) only.
# One List, so that the file is one YAML document.
apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: imbi-harness-test
      labels:
        # The runner and executor start as uid 0 with SETUID and SETGID.
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/enforce-version: latest
  - apiVersion: v1
    kind: Secret
    metadata:
      name: harness-pool
      namespace: imbi-harness-test
    stringData:
      client_id: test-pool
      client_secret: test-pool-secret-not-real
  # The model key of the fake model. The runner gets it only through a
  # model_inference resolution (plan section 6.4), never as a file.
  - apiVersion: v1
    kind: Secret
    metadata:
      name: harness-model
      namespace: imbi-harness-test
    stringData:
      key: test-model-key-not-real
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: harness-runner
      namespace: imbi-harness-test
    automountServiceAccountToken: false
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: harness-fake-api
      namespace: imbi-harness-test
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: harness-fake-api
      template:
        metadata:
          labels:
            app: harness-fake-api
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: fake-api
              image: imbi-harness:isolation
              imagePullPolicy: Never
              command: ["python3", "/opt/isolation/fake_api.py"]
              env:
                - name: POOL_CLIENT_ID
                  valueFrom:
                    secretKeyRef: {name: harness-pool, key: client_id}
                - name: POOL_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef: {name: harness-pool, key: client_secret}
                - name: MODEL_KEY
                  valueFrom:
                    secretKeyRef: {name: harness-model, key: key}
                - {name: PUBLIC_URL, value: "http://harness-fake-api:8080"}
              ports:
                - containerPort: 8080
              readinessProbe:
                httpGet: {path: /healthz, port: 8080}
                periodSeconds: 2
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              # The git repositories that the fake serves.
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: tmp
              emptyDir: {}
  - apiVersion: v1
    kind: Service
    metadata:
      name: harness-fake-api
      namespace: imbi-harness-test
    spec:
      type: NodePort
      selector:
        app: harness-fake-api
      ports:
        - port: 8080
          targetPort: 8080
          nodePort: 30080
  - apiVersion: v1
    kind: Pod
    metadata:
      name: harness
      namespace: imbi-harness-test
    spec:
      serviceAccountName: harness-runner
      automountServiceAccountToken: false
      enableServiceLinks: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        # No fsGroup: it would give a group access to the credential volumes.
      containers:
        - name: runner
          image: imbi-harness:isolation
          imagePullPolicy: Never
          # Test only. The runner exits after one chain, and P5 deletes
          # the pod then. P5a has no pod deletion, and a container
          # restart has a growing back-off, so a loop starts the next
          # runner process and logs each exit for test_lifecycle.py.
          command: ["tini", "-g", "--", "sh", "-c"]
          args:
            - >-
              while :; do imbi-harness runner;
              echo "runner-exit $? $(date +%s.%N)"; sleep 1; done
          env:
            - {name: IMBI_API_URL, value: "http://harness-fake-api:8080"}
            - {name: IMBI_HARNESS_MCP_URL, value: "http://harness-fake-api:8080/mcp"}
          securityContext: &privilege
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["SETUID", "SETGID"]
          volumeMounts:
            - {name: work, mountPath: /work}
            - {name: executor-socket, mountPath: /run/executor}
            - {name: runner-credentials, mountPath: /run/creds}
            - {name: pool, mountPath: /var/run/secrets/imbi/pool, readOnly: true}
            - name: service-account-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        - name: executor
          image: imbi-harness:isolation
          imagePullPolicy: Never
          args: ["executor"]
          env:
            - {name: IMBI_API_URL, value: "http://harness-fake-api:8080"}
          securityContext: *privilege
          volumeMounts:
            - {name: work, mountPath: /work}
            - {name: executor-socket, mountPath: /run/executor}
            - {name: executor-credentials, mountPath: /run/creds}
      volumes:
        - name: work
          emptyDir: {}
        - name: executor-socket
          emptyDir: {medium: Memory}
        - name: runner-credentials
          emptyDir: {medium: Memory}
        - name: executor-credentials
          emptyDir: {medium: Memory}
        # Owned by uid 0, mode 0400: only the processes' uid 0 reads them.
        - name: pool
          secret: {secretName: harness-pool, defaultMode: 0400}
        - name: service-account-token
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 3600}

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# A /26 pod range for the node (61 addresses): kind gives the addresses
# in turn, so the T15 test of test_proxy.py soon gets a deleted pod's
# address again. The suites run at most about 13 pods at the same time.
kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    controllerManager:
      extraArgs:
        node-cidr-mask-size: "26"
nodes:
  - role: control-plane
    # The fake API's node port, for the lifecycle suite on the host.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP

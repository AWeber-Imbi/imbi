# Relational schema for imbi-scheduler.
#
# Declarative on purpose, mirroring the shape of the graph's schemata.toml:
# the initializer walks this file and issues idempotent DDL, so adding a
# column is a data change rather than a code change. There is no
# `credentials` table — see ADR 0002.
#
# The schema name itself is not recorded here; it comes from
# IMBI_SCHEDULER_SCHEMA so a deployment can relocate it.

[[tables]]
name = "tasks"

[tables.columns]
id = "UUID NOT NULL"
slug = "TEXT NOT NULL"
name = "TEXT NOT NULL"
description = "TEXT"
organization = "TEXT"
enabled = "BOOLEAN NOT NULL DEFAULT TRUE"
kind = "TEXT NOT NULL"
trigger = "JSONB NOT NULL"
timezone = "TEXT NOT NULL DEFAULT 'UTC'"
identity = "JSONB"
target = "JSONB NOT NULL"
execution = "JSONB NOT NULL"
tags = "TEXT[] NOT NULL DEFAULT '{}'"
created_by = "TEXT NOT NULL"
created_at = "TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW()"
updated_at = "TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW()"
last_run_at = "TIMESTAMP WITH TIME ZONE"
next_run_at = "TIMESTAMP WITH TIME ZONE"
consecutive_skips = "INTEGER NOT NULL DEFAULT 0"
consecutive_no_effect = "INTEGER NOT NULL DEFAULT 0"

[tables.primary_key]
columns = ["id"]

[[tables.indexes]]
name = "tasks_slug_key"
columns = ["slug"]
unique = true

# The claim query's access path: enabled tasks ordered by when they are due.
[[tables.indexes]]
name = "tasks_due_idx"
columns = ["enabled", "next_run_at"]

[[tables.indexes]]
name = "tasks_organization_idx"
columns = ["organization"]

[[tables.indexes]]
name = "tasks_kind_idx"
columns = ["kind"]

# In-flight execution slots. `max_running_instances` has to hold across
# replicas, and an in-process counter only ever bounds one of them, so a slot
# is reserved here before a firing starts.
#
# `expires_at` makes it a lease rather than a promise: a replica killed
# mid-run never deletes its own row, so the slot has to free itself or the
# task would never fire again.
#
# The row doubles as the registry of what is running right now, which is what
# makes `POST /runs/{run_id}/cancel` answerable: `run_id` names the firing and
# `cancel_requested` is the durable record that somebody asked it to stop.
# Enforcement is a NOTIFY to whichever replica owns the run — see
# `Tasks.request_cancel`.
[[tables]]
name = "run_leases"

[tables.columns]
id = "UUID NOT NULL"
task_id = "UUID NOT NULL"
run_id = "UUID NOT NULL"
acquired_at = "TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT NOW()"
expires_at = "TIMESTAMP WITH TIME ZONE NOT NULL"
cancel_requested = "BOOLEAN NOT NULL DEFAULT FALSE"

[tables.primary_key]
columns = ["id"]

[[tables.indexes]]
name = "run_leases_task_idx"
columns = ["task_id"]

[[tables.indexes]]
name = "run_leases_run_key"
columns = ["run_id"]
unique = true

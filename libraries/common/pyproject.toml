[project]
name = "imbi-common"
version = "2.65.0"
description = "Shared library for the Imbi ecosystem providing core data access, authentication primitives, and domain models"
readme = "README.md"
requires-python = ">=3.14"
license = "BSD-3-Clause"
authors = [
  { name = "Gavin M. Roy", email = "gavinr@aweber.com" },
  { name = "Dave Shawley", email = "daves@aweber.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "argon2-cffi>=23.1",
  # httpx verifies TLS against certifi's bundle. 2026.10.23 drops the
  # eMudhra roots after the 2026-10-19 intermediate key compromise.
  "certifi>=2026.10.23",
  "cryptography>=42.0.4",
  "google-re2>=1.1",
  "httpx>=0.28.1,<1",
  "jinja2~=3.1",
  "jsonpatch>=1.33",
  "jsonpointer>=3.1.1",
  "jsonschema-models",
  "markdown-it-py>=3.0",
  "nanoid>=2.0.0",
  "orjson",
  "prometheus-client>=0.21",
  "pydantic-settings",
  "pydantic[email]>=2.0",
  "pyjwt>=2.10.1",
  "python-slugify",
  "typer>=0.21.1",
]

[project.optional-dependencies]
databases = [
  "apache-iggy>=0.10.0",
  "clickhouse-connect[async]==1.0.0",
  "fastembed>=0.6",
  "pgvector>=0.3",
  "psycopg[binary,pool]>=3.3",
  "psycopg-pool>=3.3.3",
  "valkey>=6",
]
llm = [
  "anthropic>=0.115.0",
]
mcp = [
  "fastmcp>=4.2.3,<5",
  "httpx2>=2.16.2",
]
otel = [
  "opentelemetry-api==1.45.2",
  "opentelemetry-distro==0.66b2",
  "opentelemetry-exporter-otlp-proto-http==1.45.2",
  "opentelemetry-exporter-prometheus==0.66b2",
  "opentelemetry-instrumentation-aiohttp-client==0.66b2",
  "opentelemetry-instrumentation-asyncio==0.66b2",
  "opentelemetry-instrumentation-fastapi==0.66b2",
  "opentelemetry-instrumentation-httpx==0.66b2",
  "opentelemetry-instrumentation-mcp==0.63.1",
  "opentelemetry-instrumentation-psycopg==0.66b2",
  "opentelemetry-instrumentation-redis==0.66b2",
  "opentelemetry-sdk==1.45.2",
]
posthog = [
  "posthog==7.84.0",
]
script = [
  "jsonschema[format-nongpl]>=4.26",
  "pydantic-monty~=1.5",
]
sentry = [
  "sentry-sdk>=2.48.0",
]
server = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Coverage for the per-member `moon run common:test` run. Scoped to this
# member so the report/threshold reflect only imbi.common; the aggregate
# `root:coverage` run uses the root pyproject config instead.
[tool.coverage.run]
branch = true
source_pkgs = ["imbi.common"]

[tool.coverage.report]
exclude_also = ["typing.TYPE_CHECKING"]
fail_under = 85
show_missing = true

[tool.hatch.build.targets.wheel]
packages = ["src/imbi"]
include = [
  "src/imbi/common/py.typed",
  "src/imbi/common/log-config.toml",
  "src/imbi/common/clickhouse/schemata.toml",
  "src/imbi/common/graph/schemata.toml",
  "src/imbi/common/organizations_schemata.toml",
  "src/imbi/common/prompts/defaults/*.md",
]

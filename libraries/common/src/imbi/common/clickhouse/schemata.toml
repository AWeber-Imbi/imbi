# Base ClickHouse schemas for imbi-common
# These tables are used across multiple Imbi services
#
# Every DDL statement (CREATE/ALTER/DROP) must include the `{on_cluster}`
# placeholder immediately after the object identifier. At setup time it is
# replaced with `ON CLUSTER <name> ` when CLICKHOUSE_CLUSTER_NAME is set, or
# with an empty string for single-node deployments.
#
# Each table engine must be prefixed with the `{replicated}` placeholder
# (e.g. `{replicated}MergeTree()`). It becomes `Replicated` when a cluster
# name is set so engines use their `Replicated*` variants, or an empty
# string otherwise. Replicated engines rely on the server's
# `default_replica_path`/`default_replica_name` macros for the Keeper path
# and replica name.

[events]
query = """
CREATE TABLE IF NOT EXISTS imbi.events {on_cluster}(
  id                   String           DEFAULT '',
  project_id           LowCardinality(String),
  recorded_at          DateTime64(3, 'UTC'),
  type                 LowCardinality(String) DEFAULT '',
  integration          LowCardinality(String) DEFAULT '',
  attributed_to        LowCardinality(String) DEFAULT '',
  metadata             JSON,
  payload              JSON,
  version              UInt8 DEFAULT 0
) ENGINE = {replicated}ReplacingMergeTree(version)
PARTITION BY toYYYYMM(recorded_at)
ORDER BY (project_id, id);
"""
enabled = true

[operations_log]
query = """
CREATE TABLE IF NOT EXISTS imbi.operations_log {on_cluster}(
    id                String,
    occurred_at       DateTime64(3, 'UTC'),
    recorded_at       DateTime64(3, 'UTC'),
    recorded_by       LowCardinality(String),
    performed_by      Nullable(String),
    completed_at      Nullable(DateTime64(3, 'UTC')),
    project_id        LowCardinality(String),
    project_slug      LowCardinality(String),
    environment_slug  LowCardinality(String),
    entry_type        LowCardinality(String),
    description       String,
    link              Nullable(String),
    notes             Nullable(String),
    ticket_slug       Nullable(String),
    version           Nullable(String),
    _row_version      UInt64 DEFAULT 1,
    is_deleted        UInt8  DEFAULT 0,
    plugin_slug       LowCardinality(String) DEFAULT '',
    external_run_id   Nullable(String),
    INDEX idx_id id TYPE bloom_filter GRANULARITY 4,
    INDEX idx_ext_run external_run_id TYPE bloom_filter GRANULARITY 4
) ENGINE = {replicated}ReplacingMergeTree(_row_version)
PARTITION BY toYYYYMM(occurred_at)
ORDER BY (project_id, id);
"""
enabled = true

[pull_requests]
query = """
CREATE TABLE IF NOT EXISTS imbi.pull_requests {on_cluster}(
    project_id      LowCardinality(String),
    pr_id           String,
    pr_number       UInt32,
    title           String,
    url             String,
    state           LowCardinality(String),
    author          String,
    draft           Bool,
    merged          Bool,
    created_at      DateTime64(3, 'UTC'),
    updated_at      DateTime64(3, 'UTC'),
    merged_at       Nullable(DateTime64(3, 'UTC')),
    additions       UInt32,
    deletions       UInt32,
    changed_files   UInt32,
    recorded_at     DateTime64(3, 'UTC')
) ENGINE = {replicated}ReplacingMergeTree(recorded_at)
PARTITION BY toYYYYMM(created_at)
ORDER BY (project_id, pr_id);
"""
enabled = true

[score_history]
query = """
CREATE TABLE IF NOT EXISTS imbi.score_history {on_cluster}(
  project_id     LowCardinality(String),
  timestamp      DateTime64(3, 'UTC'),
  score          Float32,
  previous_score Float32,
  change_reason  LowCardinality(String),
  breakdown      JSON
) ENGINE = {replicated}MergeTree()
PARTITION BY toYear(timestamp)
ORDER BY (project_id, timestamp);
"""
enabled = true

[score_latest_data]
query = """
CREATE MATERIALIZED VIEW IF NOT EXISTS imbi.score_latest_data {on_cluster}
ENGINE = {replicated}AggregatingMergeTree()
ORDER BY project_id
AS SELECT
    project_id,
    argMaxState(score, timestamp)     AS latest_score,
    avgState(score)                   AS avg_score,
    maxState(timestamp)               AS last_updated
FROM imbi.score_history
GROUP BY project_id;
"""
enabled = true

[score_latest]
query = """
CREATE VIEW IF NOT EXISTS imbi.score_latest {on_cluster}AS
SELECT
    project_id,
    argMaxMerge(latest_score) AS latest_score,
    avgMerge(avg_score)       AS avg_score,
    maxMerge(last_updated)    AS last_updated
FROM imbi.score_latest_data
GROUP BY project_id;
"""
enabled = true

[commits]
query = """
CREATE TABLE IF NOT EXISTS imbi.commits {on_cluster}(
  project_id    LowCardinality(String),
  sha           String,
  short_sha     String DEFAULT substring(sha, 1, 7),
  ref           LowCardinality(String),
  message       String,
  author_name   String DEFAULT '',
  author_email  String DEFAULT '',
  author_login  LowCardinality(String) DEFAULT '',
  author_user   LowCardinality(String) DEFAULT '',
  committer_name  String DEFAULT '',
  ci_status     LowCardinality(String) DEFAULT 'unknown',
  authored_at   DateTime64(3, 'UTC'),
  committed_at  Nullable(DateTime64(3, 'UTC')),
  url           String DEFAULT '',
  pushed_at     DateTime64(3, 'UTC'),
  recorded_at   DateTime64(3, 'UTC')
) ENGINE = {replicated}ReplacingMergeTree(recorded_at)
PARTITION BY toYear(authored_at)
ORDER BY (project_id, sha);
"""
enabled = true

[document_versions]
query = """
CREATE TABLE IF NOT EXISTS imbi.document_versions {on_cluster}(
  document_id   String,
  version       UInt32,
  title         String,
  content       String,
  tags          Array(String),
  change_kind   LowCardinality(String),
  updated_by    String,
  updated_at    DateTime64(3, 'UTC'),
  recorded_at   DateTime64(3, 'UTC')
) ENGINE = {replicated}ReplacingMergeTree(recorded_at)
PARTITION BY toYear(updated_at)
ORDER BY (document_id, version);
"""
enabled = true

[tags]
query = """
CREATE TABLE IF NOT EXISTS imbi.tags {on_cluster}(
  project_id    LowCardinality(String),
  name          String,
  sha           String,
  message       String DEFAULT '',
  tagger_name   String DEFAULT '',
  tagger_email  String DEFAULT '',
  tagged_at     Nullable(DateTime64(3, 'UTC')),
  url           String DEFAULT '',
  recorded_at   DateTime64(3, 'UTC')
) ENGINE = {replicated}ReplacingMergeTree(recorded_at)
PARTITION BY toYear(recorded_at)
ORDER BY (project_id, name);
"""
enabled = true

# Scheduler run history. One row per attempt, rewritten as the run
# transitions: `_row_version` increments so a `running` row and its terminal
# row collapse to one under ReplacingMergeTree.
#
# `no_effect` is a distinct terminal state, not a flavor of success — a gateway
# 204 means the delivery was accepted and then dropped, and folding that into
# `succeeded` would hide a task that silently does nothing forever.
[scheduler_runs]
query = """
CREATE TABLE IF NOT EXISTS imbi.scheduler_runs {on_cluster}(
    run_id            String,
    task_id           String,
    task_slug         LowCardinality(String),
    organization      LowCardinality(String) DEFAULT '',
    fired_at          DateTime64(3, 'UTC'),
    started_at        Nullable(DateTime64(3, 'UTC')),
    finished_at       Nullable(DateTime64(3, 'UTC')),
    duration_ms       UInt32 DEFAULT 0,
    state             LowCardinality(String),
    attempt           UInt8 DEFAULT 1,
    identity_kind     LowCardinality(String) DEFAULT '',
    principal_name    LowCardinality(String) DEFAULT '',
    actor_name        LowCardinality(String) DEFAULT '',
    consent_id        String DEFAULT '',
    target_kind       LowCardinality(String),
    target_summary    String,
    http_status       UInt16 DEFAULT 0,
    response_excerpt  String DEFAULT '',
    error_type        LowCardinality(String) DEFAULT '',
    error_message     String DEFAULT '',
    trace_id          String DEFAULT '',
    _row_version      UInt64 DEFAULT 1,
    -- `run_id` is the second key column, so a lookup by it alone cannot use
    -- the primary key and would read every part. Both the single-run read
    -- (`GET /runs/<run_id>`) and the cancel path do exactly that, and neither
    -- knows the task_id that would make the key usable. Mirrors
    -- `operations_log`, which indexes `id` for the same reason.
    INDEX idx_run_id run_id TYPE bloom_filter GRANULARITY 4
) ENGINE = {replicated}ReplacingMergeTree(_row_version)
PARTITION BY toYYYYMM(fired_at)
ORDER BY (task_id, run_id)
-- 90 day retention, on `fired_at` and with no DELETE WHERE. Both choices are
-- forced by the two-row write: `start` inserts the `running` row and `finish`
-- inserts the terminal one, and TTL is evaluated per row at merge time. A
-- predicate sparing `running` rows -- or a TTL on the Nullable `finished_at`,
-- which only the terminal row has -- expires the terminal row while keeping
-- its `running` twin, and dedup then resurrects that twin as the survivor: a
-- long-finished run reads as permanently in flight. Verified against a live
-- server, both ways. Keying on `fired_at`, which every row of a run shares,
-- expires the pair together instead. The cost is that a run stranded in
-- `running` by a replica that died mid-flight also ages out at 90 days rather
-- than being kept as evidence. `toDateTime` is required rather than cosmetic:
-- a TTL expression must yield Date or DateTime, and `DateTime64 + INTERVAL`
-- yields DateTime64, which the server rejects with BAD_TTL_EXPRESSION at
-- CREATE time. Matches the document analytics tables below.
TTL toDateTime(fired_at) + INTERVAL 90 DAY;
"""
enabled = true

[document_read_events]
query = """
CREATE TABLE IF NOT EXISTS imbi.document_read_events {on_cluster}(
  org_slug           LowCardinality(String),
  document_id        String,
  session_id         String,
  seq                UInt32,
  principal          String,
  surface            LowCardinality(String) DEFAULT 'web',
  project_id         LowCardinality(String) DEFAULT '',
  document_version   UInt32 DEFAULT 0,
  estimated_read_ms  UInt32 DEFAULT 0,
  session_started_at DateTime64(3, 'UTC'),
  recorded_at        DateTime64(3, 'UTC'),
  engaged_ms         UInt32 DEFAULT 0,
  max_scroll_pct     UInt8  DEFAULT 0,
  clamped            UInt8  DEFAULT 0,
  is_final           UInt8  DEFAULT 0
) ENGINE = {replicated}ReplacingMergeTree(recorded_at)
PARTITION BY toYYYYMM(session_started_at)
ORDER BY (org_slug, document_id, session_id, seq)
-- `(session_id, seq)` in the key makes a retried or double-delivered
-- heartbeat dedup to one row, so the `sendBeacon` flush racing the interval
-- heartbeat cannot double-count engaged time.
--
-- TTL is on `session_started_at`, which every row of a session shares, rather
-- than on the per-row `recorded_at`. TTL is evaluated per row at merge time,
-- so keying on `recorded_at` would expire a session's early heartbeats while
-- its later ones survive, leaving a truncated session whose engaged total is
-- silently short. Sessions expire whole instead.
TTL toDateTime(session_started_at) + INTERVAL 90 DAY;
"""
enabled = true

[document_read_sessions]
query = """
CREATE TABLE IF NOT EXISTS imbi.document_read_sessions {on_cluster}(
  org_slug          LowCardinality(String),
  document_id       String,
  session_id        String,
  principal         String,
  surface           LowCardinality(String) DEFAULT 'web',
  project_id        LowCardinality(String) DEFAULT '',
  document_version  UInt32 DEFAULT 0,
  started_at        DateTime64(3, 'UTC'),
  ended_at          DateTime64(3, 'UTC'),
  engaged_ms        UInt32 DEFAULT 0,
  max_scroll_pct    UInt8  DEFAULT 0,
  is_view           UInt8  DEFAULT 0,
  is_read           UInt8  DEFAULT 0,
  finalized_at      DateTime64(3, 'UTC')
) ENGINE = {replicated}ReplacingMergeTree(finalized_at)
PARTITION BY toYYYYMM(started_at)
ORDER BY (org_slug, document_id, session_id)
-- One row per finalized session, written by the finalizer once a session's
-- engaged total and scroll depth are both known. Every reported number
-- (last read, readers, views, engaged-time distribution, trends) comes from
-- this table, so it outlives the raw heartbeats it was derived from. Keyed on
-- `session_id` alone within a document so a reaper finalizing a session the
-- client also finalized dedups to one row rather than double-counting it.
TTL toDateTime(started_at) + INTERVAL 2 YEAR;
"""
enabled = true

# The SBoM component set of a release, as two tables: immutable fact rows
# and the batch record that publishes them.
#
# This is the tabular half of the component catalog. Identity (`Component`,
# `ComponentRelease`) and governance stay in the graph; the usage fact
# joining a release to a component lives here, because that fact is what
# every component report aggregates over and what the graph traversal
# could not answer at any tolerable cost.
#
# A batch is published by its row in `release_component_batches`, written
# after every fact row of that batch. Readers resolve a release to one
# batch and match fact rows on `(release_id, batch_id)`:
#
#   SELECT release_id,
#          argMax(batch_id, (source = 'ingest', recorded_at)) AS batch_id
#     FROM imbi.release_component_batches
#    WHERE release_id IN {release_ids}
#    GROUP BY release_id
#
# Publishing separately is what makes three things work. An ingest that
# found no components is representable, as a batch with `component_count`
# 0 -- keyed on the fact rows alone it would write nothing and the
# previous batch would stay current, so the release would keep reporting
# components it had dropped. Two ingests landing in the same millisecond
# resolve to one snapshot rather than the union of both, because `argMax`
# returns a single `batch_id` (which of them wins is undefined, as
# concurrent PUTs for one release already are). And a backfill can never
# outrank an ingest, because `source = 'ingest'` leads the resolver key
# -- once a release has an ingest batch, no backfill can displace it,
# whatever order the two land in, so there is no check-then-publish race
# to lose.
#
# Fact rows whose batch was never published are inert, so a failed or
# interrupted write leaves readers on the previous complete snapshot.
#
# `component_count` is the rows written and `parsed_count` the components
# the SBoM held. They differ when the graph upsert dropped some component
# -- which stays non-fatal -- so a snapshot that claims to be complete
# without being complete is detectable rather than silent.
#
# Plain `MergeTree`: batches are immutable, so there is nothing for a
# `ReplacingMergeTree` to collapse. Superseded batches stay readable for
# debugging and can take a TTL later if volume warrants one.
#
# `LowCardinality` is applied only to genuinely bounded dimensions. The
# nanoid columns are plain `String` for the same reason `commits.sha` is:
# they have no ceiling.
[release_component_batches]
query = """
CREATE TABLE IF NOT EXISTS imbi.release_component_batches {on_cluster}(
  release_id       String,
  batch_id         String,
  project_id       LowCardinality(String),
  source           LowCardinality(String) DEFAULT 'ingest',
  component_count  UInt32,
  parsed_count     UInt32,
  recorded_at      DateTime64(3, 'UTC')
) ENGINE = {replicated}MergeTree()
ORDER BY (release_id, recorded_at, batch_id);
"""
enabled = true

# `ORDER BY` leads with `component_id` because every report filters on it
# first. The per-release hydration read matches on `(release_id,
# batch_id)` instead and scans; the table is small enough that this is
# fine, and worth revisiting only if measurement says otherwise.
[release_components]
query = """
CREATE TABLE IF NOT EXISTS imbi.release_components {on_cluster}(
  batch_id              String,
  release_id            String,
  project_id            LowCardinality(String),
  component_id          String,
  component_release_id  String,
  purl_name             String,
  ecosystem             LowCardinality(String),
  version               String,
  scope                 LowCardinality(String) DEFAULT '',
  groups                Array(String),
  recorded_at           DateTime64(3, 'UTC')
) ENGINE = {replicated}MergeTree()
ORDER BY (component_id, release_id, batch_id, component_release_id);
"""
enabled = true

# The durable history of what global maintenance operations did. One table
# holds three kinds of append-only event, told apart by `event_type`:
#
#   `run`       one per finished run, written at finalize, carrying the
#               authoritative Valkey counters in `detail`
#   `attempt`   one per project per claim, written by the worker whatever
#               the outcome
#   `activity`  zero or more per attempt, written by the operation itself
#
# Separating them is what keeps counts meaningful: a sweep writes on the
# order of 10^4 attempt rows and can write many times that in activity
# rows, so counting the two together would report events rather than
# outcomes.
#
# Plain `MergeTree`: rows are immutable facts. A project that runs twice
# writes two attempts under two `attempt_id`s, which is the truth, so
# there is nothing for a `ReplacingMergeTree` to collapse.
#
# `ORDER BY (occurred_at, id)` is exactly the keyset the read endpoint
# pages on. A third key column absent from the cursor would put page
# boundaries at odds with the sort order whenever two rows share a
# millisecond -- routine during a sweep. Every other filter (`slug`,
# `disposition`, `run_id`, `project_id`) is served by a skip index
# instead: `set` for the genuinely bounded columns, `bloom_filter` for the
# nanoid-shaped ones.
#
# `item_id` is the work item the run enumerated; `project_id` is set only
# when that item *is* a project, which it is for every operation but
# `search-reindex` (whose items are `Label:node_id`). Keeping them apart
# is what lets a reader link a row to a project without having to know
# which operations are project-scoped.
#
# `project_slug` is a snapshot of what the project was called when the
# work ran; a rename does not rewrite history, and the UI links by
# `project_id`.
#
# `toDateTime` in the TTL is required rather than cosmetic: a TTL
# expression must yield Date or DateTime, and `DateTime64 + INTERVAL`
# yields DateTime64, which the server rejects at CREATE time.
[maintenance_log]
query = """
CREATE TABLE IF NOT EXISTS imbi.maintenance_log {on_cluster}(
  id            String,
  occurred_at   DateTime64(3, 'UTC'),
  run_id        String,
  attempt_id    String DEFAULT '',
  item_id       String DEFAULT '',
  slug          LowCardinality(String),
  event_type    LowCardinality(String),
  disposition   LowCardinality(String),
  action        LowCardinality(String) DEFAULT '',
  project_id    LowCardinality(String) DEFAULT '',
  project_slug  LowCardinality(String) DEFAULT '',
  message       String DEFAULT '',
  detail        JSON,
  duration_ms   UInt32 DEFAULT 0,
  started_by    LowCardinality(String) DEFAULT '',
  INDEX idx_event event_type TYPE set(8) GRANULARITY 4,
  INDEX idx_slug slug TYPE set(64) GRANULARITY 4,
  INDEX idx_disposition disposition TYPE set(16) GRANULARITY 4,
  INDEX idx_run run_id TYPE bloom_filter GRANULARITY 4,
  INDEX idx_project project_id TYPE bloom_filter GRANULARITY 4
) ENGINE = {replicated}MergeTree()
PARTITION BY toYYYYMM(occurred_at)
ORDER BY (occurred_at, id)
TTL toDateTime(occurred_at) + INTERVAL 90 DAY;
"""
enabled = true

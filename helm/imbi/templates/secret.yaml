{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "imbi.fullname" . }}
  labels:
    {{- include "imbi.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ required "auth.jwtSecret is required" .Values.auth.jwtSecret | quote }}
  encryption-key: {{ required "auth.encryptionKey is required" .Values.auth.encryptionKey | quote }}
  clickhouse-url: {{ include "imbi.clickhouseUrl" . | quote }}
  postgres-url: {{ include "imbi.postgresUrl" . | quote }}
  {{- if .Values.assistant.anthropicApiKey }}
  anthropic-api-key: {{ .Values.assistant.anthropicApiKey | quote }}
  {{- end }}
  {{- if or .Values.scheduler.serviceAccount.clientId .Values.scheduler.serviceAccount.clientSecret }}
  {{- /* Either half, not just clientId. Keying on clientId alone meant a
         values file setting only clientSecret rendered *neither* key and
         reported nothing, leaving the scheduler to skip every api-target
         firing for want of a credential the operator believed they had
         supplied. With `or`, a half-configured pair reaches one of these two
         `required` calls and fails at render with the missing half named. */}}
  scheduler-sa-client-id: {{ required "scheduler.serviceAccount.clientId is required when clientSecret is set" .Values.scheduler.serviceAccount.clientId | quote }}
  scheduler-sa-client-secret: {{ required "scheduler.serviceAccount.clientSecret is required when clientId is set" .Values.scheduler.serviceAccount.clientSecret | quote }}
  {{- end }}
  {{- if .Values.storage.accessKey }}
  s3-access-key: {{ .Values.storage.accessKey | quote }}
  s3-secret-key: {{ .Values.storage.secretKey | quote }}
  {{- end }}
{{- end }}

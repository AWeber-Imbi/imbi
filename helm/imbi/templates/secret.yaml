{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "imbi.fullname" . }}
  labels:
    {{- include "imbi.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ required "auth.jwtSecret is required" .Values.auth.jwtSecret | quote }}
  encryption-key: {{ required "auth.encryptionKey is required" .Values.auth.encryptionKey | quote }}
  {{- /* Required whatever `environment` is: a generated key differs per
         process, so a value encrypted by one replica cannot be read by
         another or after a restart. */}}
  config-encryption-key: {{ required "auth.configEncryptionKey is required (a Fernet key, different from auth.encryptionKey)" .Values.auth.configEncryptionKey | quote }}
  clickhouse-url: {{ include "imbi.clickhouseUrl" . | quote }}
  iggy-url: {{ include "imbi.iggyUrl" . | quote }}
  postgres-url: {{ include "imbi.postgresUrl" . | quote }}
  {{- if include "imbi.iggyConnectEnabled" . }}
  {{- /* Both halves of the connectors runtime's credentials. The api key
         is what imbi-api checks before handing over a response carrying
         the ClickHouse password, so there is no usable default: an empty
         value leaves imbi-api answering 503 and the runtime exiting. */}}
  iggy-connectors-api-key: {{ required "iggyConnect.apiKey is required when iggyConnect.enabled (invent one; imbi-api checks it)" .Values.iggyConnect.apiKey | quote }}
  iggy-password: {{ required "iggyConnect.iggy.password is required when iggyConnect.enabled" .Values.iggyConnect.iggy.password | quote }}
  {{- end }}
  {{- if include "imbi.slackbotEnabled" . }}
  anthropic-api-key: {{ required "assistant.anthropicApiKey is required for the Slack bot" .Values.assistant.anthropicApiKey | quote }}
  slack-bot-token: {{ required "slackbot.botToken is required for the Slack bot" .Values.slackbot.botToken | quote }}
  slack-app-token: {{ required "slackbot.appToken is required for the Slack bot" .Values.slackbot.appToken | quote }}
  {{- else if .Values.assistant.anthropicApiKey }}
  anthropic-api-key: {{ .Values.assistant.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.externalValkey.url }}
  valkey-url: {{ .Values.externalValkey.url | quote }}
  {{- end }}
  {{- if or .Values.scheduler.serviceAccount.clientId .Values.scheduler.serviceAccount.clientSecret }}
  {{- /* Either half, not just clientId. Keying on clientId alone meant a
         values file setting only clientSecret rendered *neither* key and
         reported nothing, leaving the scheduler to skip every api-target
         firing for want of a credential the operator believed they had
         supplied. With `or`, a half-configured pair reaches one of these two
         `required` calls and fails at render with the missing half named. */}}
  scheduler-sa-client-id: {{ required "scheduler.serviceAccount.clientId is required when clientSecret is set" .Values.scheduler.serviceAccount.clientId | quote }}
  scheduler-sa-client-secret: {{ required "scheduler.serviceAccount.clientSecret is required when clientId is set" .Values.scheduler.serviceAccount.clientSecret | quote }}
  {{- end }}
  {{- if or .Values.workflows.serviceAccount.clientId .Values.workflows.serviceAccount.clientSecret }}
  {{- /* Either half, as for the scheduler above. */}}
  workflows-sa-client-id: {{ required "workflows.serviceAccount.clientId is required when clientSecret is set" .Values.workflows.serviceAccount.clientId | quote }}
  workflows-sa-client-secret: {{ required "workflows.serviceAccount.clientSecret is required when clientId is set" .Values.workflows.serviceAccount.clientSecret | quote }}
  {{- end }}
  {{- if eq .Values.service.mode "gateway" }}
  gateway-sa-token: {{ required "gateway.serviceAccount.token is required when service.mode is 'gateway' -- the container does not start without it" .Values.gateway.serviceAccount.token | quote }}
  {{- else if .Values.gateway.serviceAccount.token }}
  gateway-sa-token: {{ .Values.gateway.serviceAccount.token | quote }}
  {{- end }}
  {{- if .Values.storage.accessKey }}
  s3-access-key: {{ .Values.storage.accessKey | quote }}
  s3-secret-key: {{ .Values.storage.secretKey | quote }}
  {{- end }}
{{- end }}

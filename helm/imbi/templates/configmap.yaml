apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "imbi.fullname" . }}
  labels:
    {{- include "imbi.labels" . | nindent 4 }}
data:
  IMBI_ASSISTANT_ENABLED: {{ .Values.assistant.enabled | quote }}
  # Internal upstream URL used by imbi-mcp and imbi-assistant for
  # service-to-service calls to imbi-api. Distinct from the API's
  # public URL. Defaults to the in-pod loopback for "all" mode; set
  # service.internalApiUrl when running imbi-mcp or imbi-assistant
  # as separate pods.
  IMBI_INTERNAL_API_URL: {{ .Values.service.internalApiUrl | quote }}
  # imbi-gateway reads its own upstream setting rather than the one above, so
  # it is set here rather than left to the gateway's own default of
  # http://imbi-api:8000 -- a service name this chart does not create. Pointed
  # at the same value, which is the in-pod loopback unless overridden: right
  # for "all" and "api" mode, and guarded below for a standalone gateway.
  {{- if eq .Values.service.mode "gateway" }}
  {{- if eq .Values.service.internalApiUrl "http://localhost:8000" }}
  {{- fail "service.internalApiUrl must point at imbi-api when service.mode is 'gateway' (e.g. http://imbi-api.<namespace>.svc.cluster.local:8000) -- the default is an in-pod loopback, which in a standalone gateway pod resolves to the gateway itself, so every action it takes fails to connect while the pod reports healthy" }}
  {{- end }}
  {{- end }}
  ACTIONS_IMBI_URL: {{ .Values.service.internalApiUrl | quote }}
  {{- if eq .Values.service.mode "scheduler" }}
  {{- if eq .Values.service.internalApiUrl "http://localhost:8000" }}
  {{- fail "service.internalApiUrl must point at imbi-api when service.mode is 'scheduler' (e.g. http://imbi-api.<namespace>.svc.cluster.local:8000) -- the default is an in-pod loopback, which in a standalone scheduler pod resolves to the scheduler itself, so every api-target firing fails while the pod reports healthy" }}
  {{- end }}
  # Required in scheduler mode, not optional as below: the container's
  # require_scheduler_vars() exits at startup without it, so an unset value
  # here is a CrashLoopBackOff rather than a degraded pod. Failed at render
  # time instead, where the message says what to set.
  IMBI_API_URL: {{ required "service.publicApiUrl is required when service.mode is 'scheduler' -- imbi-scheduler re-derives imbi-api's route prefix from its path, and the container refuses to start without it" .Values.service.publicApiUrl | quote }}
  {{- else if .Values.service.publicApiUrl }}
  # imbi-api's public URL. Its path component is the prefix imbi-api mounts
  # its routes under, and the prefix imbi-scheduler re-derives to build the
  # paths it calls. Both read it from here, so they cannot disagree.
  IMBI_API_URL: {{ .Values.service.publicApiUrl | quote }}
  {{- end }}
  IMBI_EMAIL_ENABLED: {{ .Values.email.enabled | quote }}
  {{- if .Values.email.enabled }}
  IMBI_EMAIL_SMTP_HOST: {{ .Values.email.smtp.host | quote }}
  IMBI_EMAIL_SMTP_PORT: {{ .Values.email.smtp.port | quote }}
  IMBI_EMAIL_SMTP_USE_TLS: {{ .Values.email.smtp.useTls | quote }}
  IMBI_EMAIL_FROM_EMAIL: {{ .Values.email.from.email | quote }}
  IMBI_EMAIL_FROM_NAME: {{ .Values.email.from.name | quote }}
  {{- end }}
  {{- if .Values.storage.endpointUrl }}
  S3_ENDPOINT_URL: {{ .Values.storage.endpointUrl | quote }}
  {{- end }}
  S3_BUCKET: {{ .Values.storage.bucket | quote }}
  S3_REGION: {{ .Values.storage.region | quote }}

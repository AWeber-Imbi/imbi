image:
  repository: ghcr.io/aweber-imbi/imbi
  tag: latest
  pullPolicy: IfNotPresent

# Number of replicas (used when service.mode is "all")
replicaCount: 1

# Sets ENVIRONMENT and IMBI_API_ENVIRONMENT. Any value other than
# "development" stops the services from generating the auth.jwtSecret,
# auth.encryptionKey and auth.configEncryptionKey values (they fail without
# them), and sets the Secure flag on the auth cookies.
environment: production

# Extra environment variables for the Imbi container, as a list of
# Kubernetes EnvVar objects (e.g. IMBI_API_CORS_ALLOWED_ORIGINS, SENTRY_DSN,
# IMBI_EMAIL_SMTP_USERNAME).
extraEnv: []
# Extra envFrom sources (ConfigMap or Secret references) for the Imbi
# container.
extraEnvFrom: []

# Service mode:
# - "all": run all services in one pod (uses replicaCount above)
# - "api" | "assistant" | "gateway" | "mcp" | "scheduler" | "slackbot" |
#   "workflows":
#   run a single service
# - "ui": run only the bundled Caddy, serving the UI and reverse-proxying to
#   the other services through .service.ui.upstreams
# Use the matching .service.<name>.replicas value to scale that service.
service:
  mode: all
  # Internal upstream URL imbi-mcp, imbi-assistant, imbi-scheduler, and
  # imbi-gateway use to reach imbi-api. The default works for "all" and "api"
  # modes; override when running "mcp", "assistant", "scheduler", or "gateway"
  # as separate pods (e.g.
  # http://imbi-api.<namespace>.svc.cluster.local:8080). In "scheduler" and
  # "gateway" modes the chart fails to render if this is left at the loopback
  # default: there it resolves to that pod itself, and the pod reports healthy
  # while every api-target firing (or gateway action) fails.
  internalApiUrl: "http://localhost:8000"
  # imbi-api's *public* URL, whose path component is the prefix it mounts
  # its routes under. imbi-scheduler re-derives that prefix to build the
  # paths it calls, so a scheduler pod cannot reach an API mounted under a
  # path (e.g. https://imbi.example.com/api) unless this is set to match.
  # It is also the VITE_API_URL the UI loads its API from, so it is required
  # in "all" and "ui" modes.
  publicApiUrl: ""
  api:
    replicas: 1
  assistant:
    replicas: 1
  gateway:
    replicas: 1
  mcp:
    replicas: 1
  scheduler:
    # More than one replica is safe. Claiming is what makes it so: claim_due
    # takes due tasks with FOR UPDATE SKIP LOCKED, so concurrent replicas get
    # disjoint sets and one replica claims a given occurrence. The advisory
    # lock does a different job -- enforcing execution.max_running_instances
    # and ordering a lease against a task delete -- and is not what arbitrates
    # firing. See docs/scheduler/adr/0001-trigger-engine-on-psycopg.md.
    replicas: 1
  workflows:
    # More than one replica is safe: a replica claims a run with FOR UPDATE
    # SKIP LOCKED and holds it with a lease, so replicas work on different
    # runs (ADR 0021).
    replicas: 1
  slackbot:
    # Socket mode: each replica opens its own connection to Slack and Slack
    # delivers an event to one of them, so replicas do not duplicate work.
    replicas: 1
  ui:
    replicas: 1
    # host:port of each service the Caddyfile proxies to, when they run as
    # their own releases. Left empty, Caddy falls back to the in-pod loopback,
    # which in "ui" mode reaches nothing.
    # Each chart Service listens on 8080.
    upstreams:
      api: ""        # e.g. imbi-api:8080
      mcp: ""        # e.g. imbi-mcp:8080
      assistant: ""  # e.g. imbi-assistant:8080
      gateway: ""    # e.g. imbi-gateway:8080
      scheduler: ""  # e.g. imbi-scheduler:8080

# Required authentication settings. Use the same values in every release
# and keep them stable: a changed key makes the encrypted values unreadable.
auth:
  jwtSecret: ""
  encryptionKey: ""        # Fernet key: OAuth tokens and client secrets
  configEncryptionKey: ""  # Fernet key: configuration secrets (AI keys etc.)

# Scheduler configuration
scheduler:
  # The scheduler runs every task as its own service account (ADR 0002 removed
  # the per-task credential store). Without these it starts and schedules, but
  # resolves no principal for an api target, so every such firing is skipped.
  #
  # `imbi-api setup` seeds the account to match whatever is set here, so these
  # are values to invent, not ones to copy back out of Imbi. Left empty, setup
  # generates a pair and prints it once for you to paste in.
  #
  # Both or neither: one alone is refused rather than ignored, since seeding a
  # generated credential instead would leave the scheduler holding a value that
  # authenticates nobody. In "all" mode that also stops the entrypoint from
  # provisioning, so a half-filled pair here (or a `existingSecret` carrying
  # only one of the two keys) leaves the scheduler out entirely.
  serviceAccount:
    clientId: ""
    clientSecret: ""

# Workflow engine configuration
workflows:
  # Deploy and rollback steps call imbi-api as this service account (ADR 0021).
  # Seeded by `imbi-api setup` exactly like the scheduler credential above, and
  # both or neither in the same way. The account can deploy only after an
  # operator grants it `integration:act-as-service` and the target environment
  # has `allow_autonomous` (ADR 0017).
  serviceAccount:
    clientId: ""
    clientSecret: ""
  # imbi-scheduler's task API, with its route prefix. The engine writes the
  # scheduler task of each schedule trigger here. Empty uses the in-pod
  # default (http://localhost:8005/api), which works in "all" mode only
  # (e.g. http://imbi-scheduler:8080/api for a separate release).
  schedulerUrl: ""

# Gateway configuration
gateway:
  # The gateway calls back into imbi-api to patch projects and record releases,
  # authenticating with this API key (the `ik_<id>_<secret>` form); patch
  # attribution is this key's identity. Required in "gateway" mode: the
  # container does not start without it. In "all" mode the entrypoint seeds
  # one when it is unset.
  #
  # Seeded by `imbi-api setup` exactly like the scheduler credential above.
  serviceAccount:
    token: ""

# Optional: reference an existing secret instead of specifying values above.
# The secret must contain keys: jwt-secret, encryption-key,
# config-encryption-key, clickhouse-url, iggy-url, postgres-url.
#
# Optional key: valkey-url.
#
# Conditionally required, because the deployment reads them from this same
# secret whenever the corresponding feature is switched on:
#   - anthropic-api-key            when assistant.enabled, or the Slack bot
#     is on (slackbot.enabled or service.mode "slackbot")
#   - slack-bot-token, slack-app-token  when the Slack bot is on
#   - s3-access-key, s3-secret-key when storage.accessKey is set
#   - iggy-connectors-api-key, iggy-password  when iggyConnect.enabled. The
#     runtime's two refs are not optional, so it will not start without them;
#     imbi-api's read of iggy-connectors-api-key is optional, and without it
#     imbi-api answers 503 and the runtime exits.
# Those two refs are not optional, so a secret missing a key the deployment
# asks for will fail the pod. The scheduler's scheduler-sa-client-id and
# scheduler-sa-client-secret are read whenever existingSecret is set, as are the
# workflow engine's workflows-sa-client-id and workflows-sa-client-secret and
# the gateway's gateway-sa-token, and all are marked optional -- so what a
# missing one costs depends on the mode:
#   - service.mode "scheduler": require_scheduler_vars() demands both scheduler
#     keys, so the container exits at startup and the pod CrashLoopBackOffs.
#   - service.mode "workflows": the same, for the two workflows keys.
#   - service.mode "gateway": the same, for gateway-sa-token.
#   - service.mode "all": neither is required. The entrypoint seeds a credential
#     for each service itself when the environment does not supply one.
#   - any other mode: nothing reads them, and nothing is affected.
existingSecret: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: imbi.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

# ClickHouse connection (external, required).
#
# The chart does not bundle ClickHouse; provision it externally (the Altinity
# ClickHouse operator is the recommended approach) and set the connection URL.
# See docs/deployment/kubernetes.md.
externalClickhouse:
  url: ""  # REQUIRED, e.g. clickhouse+http://default:password@clickhouse-imbi:8123/imbi

# Apache Iggy connection (external, required).
#
# Every Imbi service connects at startup and provisions the streams it
# publishes to. The chart refuses to render without this, so set it before
# the first install. The chart does not bundle Iggy;
# run the server from the same ghcr.io/aweber-imbi/iggy image in its default
# `server` mode. See docs/deployment/kubernetes.md.
externalIggy:
  url: ""  # REQUIRED, e.g. iggy+tcp://iggy:iggy@imbi-iggy:8090

# Valkey connection (external). imbi-api's background workers need it: unset,
# they do not start and imbi-api logs a warning. Rendered as VALKEY_URL.
externalValkey:
  url: ""  # e.g. valkey://imbi-valkey:6379/0

# The Apache Iggy connectors runtime: a second Deployment from the Iggy image
# that drains each stream into its ClickHouse table (ADR 0019 §3).
#
# On by default: every ClickHouse write goes through Iggy, so without this
# runtime no analytics, audit or operations-log row reaches ClickHouse. It
# needs iggyConnect.apiKey (invent one), iggyConnect.iggy.address and
# iggyConnect.iggy.password.
#
# Rendered only in "all" and "api" modes, or in any mode where
# configBaseUrl is set, so the other releases of a split install need
# nothing here.
#
# The runtime ships no sink configuration. It fetches that from imbi-api once
# at startup and never re-reads it, so a new stream needs a restart of this
# Deployment -- `kubectl rollout restart` -- to be consumed.
iggyConnect:
  enabled: true
  image:
    repository: ghcr.io/aweber-imbi/iggy
    tag: 0.9.0-edge.6-0
    pullPolicy: IfNotPresent
  replicas: 1
  # Bearer key the runtime sends to imbi-api, and the key imbi-api checks.
  # Invent it; nothing reads it back out of Imbi. The response carries the
  # ClickHouse credentials, so unset there is no permissive fallback --
  # imbi-api answers 503. Comma-separate two values to overlap a rotation.
  apiKey: ""
  # Where the runtime fetches that configuration. Left empty, the chart
  # derives it from the release's own Service and the path in
  # service.publicApiUrl. Set it to reach an imbi-api Service directly (e.g.
  # http://imbi-api:8080/api/iggy/connectors) when the API is a separate
  # release.
  configBaseUrl: ""
  # How the runtime reaches Iggy. Separate from externalIggy.url above,
  # which is a DSN for the Python SDK; this runtime takes host:port and
  # credentials on their own.
  iggy:
    address: ""  # REQUIRED when enabled, e.g. imbi-iggy:8090
    username: iggy
    password: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # Extra EnvVar objects and envFrom sources for the runtime container.
  extraEnv: []
  extraEnvFrom: []

# PostgreSQL connection (external, required).
#
# Imbi's graph database is PostgreSQL with the Apache AGE extension. The chart
# does not bundle a database; point this at an AGE-enabled PostgreSQL such as a
# CloudNativePG cluster. See docs/deployment/kubernetes.md for operator setup
# and an example Cluster manifest.
externalPostgresql:
  url: ""  # REQUIRED, e.g. postgresql://imbi:password@imbi-pg-rw:5432/imbi

# AI Assistant configuration
assistant:
  enabled: false
  anthropicApiKey: ""

# Slack bot. Always on in "slackbot" mode. In "all" mode, enabled starts it
# in the same pod. It needs both tokens and assistant.anthropicApiKey.
slackbot:
  enabled: false
  botToken: ""  # xoxb-...
  appToken: ""  # xapp-... (Socket Mode)

# Email configuration
email:
  enabled: false
  smtp:
    host: ""
    port: 587
    useTls: true
  from:
    email: ""
    name: "Imbi"

# S3-compatible storage
storage:
  endpointUrl: ""
  accessKey: ""
  secretKey: ""
  bucket: imbi-uploads
  region: us-east-1

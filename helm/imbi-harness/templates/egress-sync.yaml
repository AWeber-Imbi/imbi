{{- /*
imbi-harness egress-sync (egress allowlist PRD 5.6): one replica that
writes one Admin 200 ClusterNetworkPolicy for each egress destination
generation in Imbi, and deletes the old ones when no pod holds them. Its
pods do not have app.kubernetes.io/name=imbi-harness, so the runner
policies do not select them. The admission policy in admission.yaml
limits what it can write.
*/ -}}
{{- $np := .Values.networkPolicy }}
{{- if and $np.enabled $np.manageGlobal }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: imbi-harness-egress-sync
  labels:
    {{- include "imbi-harness.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: imbi-harness-egress-sync
  labels:
    {{- include "imbi-harness.labels" . | nindent 4 }}
rules:
  - apiGroups: ["networking.k8s.aws"]
    resources: ["clusternetworkpolicies"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: imbi-harness-egress-sync
  labels:
    {{- include "imbi-harness.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: imbi-harness-egress-sync
subjects:
  - kind: ServiceAccount
    name: imbi-harness-egress-sync
    namespace: {{ .Release.Namespace }}
---
# To find the destination generations that runner pods still hold.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: imbi-harness-egress-sync
  labels:
    {{- include "imbi-harness.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: imbi-harness-egress-sync
  labels:
    {{- include "imbi-harness.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: imbi-harness-egress-sync
subjects:
  - kind: ServiceAccount
    name: imbi-harness-egress-sync
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imbi-harness-egress-sync
  labels:
    {{- include "imbi-harness.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: imbi-harness-egress-sync
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: imbi-harness-egress-sync
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: imbi-harness-egress-sync
      enableServiceLinks: false
      securityContext:
        # The runner user of the image; the sync needs no uid 0.
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: egress-sync
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["egress-sync"]
          env:
            - name: IMBI_API_URL
              value: {{ required "imbi.apiUrl is required" .Values.imbi.apiUrl | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            # The pool credential: the sync endpoints take its token.
            - name: IMBI_HARNESS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "imbi-harness.secretName" . }}
                  key: client_id
            - name: IMBI_HARNESS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "imbi-harness.secretName" . }}
                  key: client_secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $np.sync.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

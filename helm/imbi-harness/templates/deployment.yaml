{{- if ne (include "imbi-harness.mode" .) "scaledJob" }}
# A fixed-size pool: each pod runs one chain, deletes itself, and the
# ReplicaSet starts a clean one (plan section 6.1).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "imbi-harness.pool" . }}
  labels:
    {{- include "imbi-harness.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.pool.replicas }}
  selector:
    matchLabels:
      {{- include "imbi-harness.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "imbi-harness.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "imbi-harness.podSpec" . | nindent 6 }}
{{- end }}

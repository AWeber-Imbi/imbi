{{- if not .Values.poolCredential.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "imbi-harness.secretName" . }}
  labels:
    {{- include "imbi-harness.labels" . | nindent 4 }}
type: Opaque
stringData:
  client_id: {{ required "poolCredential.clientId or poolCredential.existingSecret is required" .Values.poolCredential.clientId | quote }}
  client_secret: {{ required "poolCredential.clientSecret is required" .Values.poolCredential.clientSecret | quote }}
{{- end }}

# Runs the production all-in-one image locally (`docker compose up --build`).
services:
  imbi:
    build:
      context: .
      dockerfile: container/Dockerfile
    image: ghcr.io/aweber-imbi/imbi:local
    ports:
      - "8080:8080"
    environment:
      CLICKHOUSE_URL: clickhouse+http://default:password@clickhouse:8123/imbi
      IMBI_AUTH_ENCRYPTION_KEY: dev-encryption-key-change-in-prod
      IMBI_AUTH_JWT_SECRET: dev-jwt-secret-change-in-production
      # Public URL of the API as reachable from a browser; the /api path
      # drives FastAPI route mounting to match the Caddyfile's /api/*
      # handler. VITE_API_URL is the same value injected into the UI's
      # index.html at serve time (Caddy templates).
      IMBI_API_URL: http://localhost:8080/api
      VITE_API_URL: http://localhost:8080/api
      # Internal upstream URL used by imbi-mcp and imbi-assistant for
      # service-to-service calls to imbi-api. Distinct from IMBI_API_URL
      # (the API's public URL). Default targets the in-pod loopback used
      # by the all-in-one image.
      IMBI_INTERNAL_API_URL: http://localhost:8000
      IMBI_EMAIL_SMTP_HOST: mailpit
      IMBI_EMAIL_SMTP_PORT: "1025"
      IMBI_EMAIL_SMTP_USE_TLS: "false"
      IMBI_ENVIRONMENT: testing
      POSTGRES_URL: postgresql://postgres:secret@postgres/imbi
      # imbi-scheduler and imbi-gateway each call imbi-api as their own service
      # account (ADR 0002). Deliberately unset: this all-in-one image mints and
      # seeds a credential for each on every boot, so both come up working. Set
      # them to pin the values instead -- `imbi-api setup` then seeds the
      # accounts to match whatever is here.
      # IMBI_SCHEDULER_SA_CLIENT_ID: ""
      # IMBI_SCHEDULER_SA_CLIENT_SECRET: ""
      # ACTIONS_IMBI_TOKEN: ""
      S3_ACCESS_KEY: test
      S3_ENDPOINT_URL: http://ministack:4566
      S3_SECRET_KEY: test
    depends_on:
      clickhouse:
        condition: service_healthy
      iggy:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      ministack:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      postgres:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - 8123
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: password
      CLICKHOUSE_DB: imbi
    healthcheck:
      test: ["CMD-SHELL", "clickhouse client -q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10

  iggy:
    image: ghcr.io/aweber-imbi/iggy:0.9.0-edge.6-0
    ports:
      - 3000
      - 8090
    environment:
      IGGY_ROOT_USERNAME: iggy
      IGGY_ROOT_PASSWORD: iggy
      IGGY_HTTP_ENABLED: true
      IGGY_HTTP_ADDRESS: 0.0.0.0:3000
      IGGY_SYSTEM_SHARDING_PIN_CORES: "false"
      IGGY_TCP_ENABLED: true
      IGGY_TCP_ADDRESS: 0.0.0.0:8090
    cap_add:
      - SYS_NICE
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "iggy", "ping"]
      start_period: 15s
      start_interval: 2s
      interval: 60s
      timeout: 5s
      retries: 10

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.13.0
    ports:
      - "4317"
      - "16686"

  mailpit:
    image: axllent/mailpit:v1.21.5
    ports:
      - 8025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 10

  ministack:
    image: ministackorg/ministack
    ports:
      - "4566"
    environment:
      SERVICES: s3
      DEBUG: "0"
    healthcheck:
      # The image dropped curl; use the interpreter it already runs on.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: ghcr.io/aweber-imbi/postgres:latest
    ports:
      - 5432
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: imbi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]

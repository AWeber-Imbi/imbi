# Classification of every table in this project.
#
# organization: tenant-owned; RLS forced; organization_id NOT NULL,
#               except integrations (NULL for the instance sign-in
#               provider).
# tenancy:      the tenancy chain itself (tenants, organizations).
# instance:     identity and platform configuration; no RLS.
# catalog:      shared SBOM catalog; no RLS. imbi_app can insert rows
#               but not change or delete them. SBOM ingest writes
#               components, component_releases and
#               component_identifiers; organization users create
#               advisories.


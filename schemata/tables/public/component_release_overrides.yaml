---
name: component_release_overrides
schema: public
owner: imbi_owner
comment: The values of a component version from this organization's SBOMs, where
  they differ from the shared catalog row. The same rule as component_overrides.
columns:
- name: organization_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The organization that owns the row. Row-level security compares it with
    imbi.organization_id. Composite foreign keys include it, so a row cannot refer
    to a row in a different organization.
- name: component_release_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The component version.
- name: license
  data_type: TEXT
  comment: The license from the SBOMs of this organization. NULL means the catalog
    license.
- name: supplier
  data_type: TEXT
  comment: The supplier from the SBOMs of this organization. NULL means the catalog
    supplier.
- name: hashes
  data_type: public.jsonb_object
  comment: The content digests from the SBOMs of this organization. NULL means the
    catalog hashes.
- name: created_at
  data_type: TIMESTAMP WITH TIME ZONE
  nullable: false
  default: CURRENT_TIMESTAMP
  comment: When the row was inserted. The database sets it.
- name: updated_at
  data_type: TIMESTAMP WITH TIME ZONE
  comment: When the row last changed. The set_updated_at trigger sets it on each
    UPDATE that changes the row. NULL until the first such UPDATE.
primary_key:
- organization_id
- component_release_id
check_constraints:
- name: has_override
  expression: (num_nonnulls(license, supplier, hashes) >= 1)
foreign_keys:
- name: component_release_overrides_organization_id_fkey
  columns:
  - organization_id
  references:
    name: public.organizations
    columns:
    - id
  on_delete: RESTRICT
- name: component_release_overrides_component_release_id_fkey
  columns:
  - component_release_id
  references:
    name: public.component_releases
    columns:
    - id
  on_delete: RESTRICT
triggers:
- name: component_release_overrides_set_updated_at
  when: BEFORE
  events:
  - UPDATE
  for_each: ROW
  condition: (old.* IS DISTINCT FROM new.*)
  function: public.set_updated_at()
  comment: Sets updated_at on an UPDATE that changes the row. An UPDATE that changes
    nothing keeps it.
row_level_security:
  enabled: true
  forced: true
policies:
- name: organization_isolation
  using: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  with_check: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  comment: Rows are visible and writable only in the organization that the transaction
    sets in imbi.organization_id.

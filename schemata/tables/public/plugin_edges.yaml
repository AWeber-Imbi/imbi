---
name: plugin_edges
schema: public
owner: imbi_owner
comment: A relationship of a type that a plugin manifest declares, such as Environment
  MAPS_TO AwsAccount. Replaces the graph edges with plugin relationship types.
columns:
- name: organization_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The organization that owns the row. Row-level security compares it with
    imbi.organization_id. Composite foreign keys include it, so a row cannot refer
    to a row in a different organization.
- name: plugin_slug
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The plugin that declares the relationship type.
- name: edge_type
  data_type: TEXT
  nullable: false
  comment: The relationship name from the manifest, such as MAPS_TO.
- name: source_label
  data_type: TEXT
  nullable: false
  comment: The type of the source, such as Environment. Plugin load accepts only
    a core type whose table has a delete_plugin_edges trigger, so source_id has no
    foreign key.
- name: source_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The id of the source row in the table that source_label names.
- name: target_label
  data_type: TEXT
  nullable: false
  comment: The type of the target. The manifest limits it to the to_labels of the
    relationship type.
- name: target_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The id of the target plugin entity. Plugin load accepts only plugin entity
    types as targets. Deleting the entity deletes the edge.
- name: properties
  data_type: public.jsonb_object
  nullable: false
  default: '''{}''::jsonb'
  comment: Relationship properties, such as AWS tags. The manifest declares each
    name and type, and the API rejects unknown keys.
- name: created_at
  data_type: TIMESTAMP WITH TIME ZONE
  nullable: false
  default: CURRENT_TIMESTAMP
  comment: When the row was inserted. The database sets it.
primary_key:
- source_id
- edge_type
- target_id
foreign_keys:
- name: plugin_edges_organization_id_fkey
  columns:
  - organization_id
  references:
    name: public.organizations
    columns:
    - id
  on_delete: RESTRICT
- name: plugin_edges_plugin_slug_fkey
  columns:
  - plugin_slug
  references:
    name: public.plugin_registrations
    columns:
    - slug
  on_delete: CASCADE
- name: plugin_edges_target_id_fkey
  columns:
  - organization_id
  - target_id
  references:
    name: public.plugin_entities
    columns:
    - organization_id
    - id
  on_delete: CASCADE
indexes:
- name: plugin_edges_target_idx
  method: btree
  columns:
  - name: organization_id
  - name: target_id
row_level_security:
  enabled: true
  forced: true
policies:
- name: organization_isolation
  using: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  with_check: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  comment: Rows are visible and writable only in the organization that the transaction
    sets in imbi.organization_id.

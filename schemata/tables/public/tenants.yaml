---
name: tenants
schema: public
owner: imbi_owner
comment: 'A customer of the Imbi instance: contract, billing owner, quotas. Each
  organization belongs to one tenant. The graph has no tenant; the migration adds
  this table so tenancy exists before billing and identity depend on it. Today each
  tenant has one organization.'
columns:
- name: id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: Nanoid primary key. The application generates it. It does not change,
    so UI routes, API paths and other rows can refer to it.
- name: name
  data_type: TEXT
  nullable: false
  comment: Display name of the customer.
- name: slug
  data_type: public.slug
  nullable: false
  collation: pg_catalog."C"
  comment: URL-safe identifier, unique in the instance. No application code uses
    it yet.
- name: created_at
  data_type: TIMESTAMP WITH TIME ZONE
  nullable: false
  default: CURRENT_TIMESTAMP
  comment: When the row was inserted. The database sets it.
- name: updated_at
  data_type: TIMESTAMP WITH TIME ZONE
  comment: When the row last changed. The set_updated_at trigger sets it on each
    UPDATE that changes the row. NULL until the first such UPDATE.
primary_key:
- id
unique_constraints:
- - slug
triggers:
- name: tenants_set_updated_at
  when: BEFORE
  events:
  - UPDATE
  for_each: ROW
  condition: (old.* IS DISTINCT FROM new.*)
  function: public.set_updated_at()
  comment: Sets updated_at on an UPDATE that changes the row. An UPDATE that changes
    nothing keeps it.
row_level_security:
  enabled: false

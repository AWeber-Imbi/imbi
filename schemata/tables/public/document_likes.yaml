---
name: document_likes
schema: public
owner: imbi_owner
comment: A thumbs-up from one user on one document. Replaces the LIKED edge. One
  row per user makes a like atomic, and likes do not count as reads in document analytics.
columns:
- name: organization_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The organization that owns the row. Row-level security compares it with
    imbi.organization_id. Composite foreign keys include it, so a row cannot refer
    to a row in a different organization.
- name: document_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The liked document.
- name: user_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The user who liked it. Anyone who can read the document can see this list.
- name: liked_at
  data_type: TIMESTAMP WITH TIME ZONE
  nullable: false
  default: CURRENT_TIMESTAMP
  comment: When the user liked the document. The liker list sorts on it, newest first.
    Replaces the at property of the LIKED edge.
primary_key:
- document_id
- user_id
foreign_keys:
- name: document_likes_organization_id_fkey
  columns:
  - organization_id
  references:
    name: public.organizations
    columns:
    - id
  on_delete: RESTRICT
- name: document_likes_document_id_fkey
  columns:
  - organization_id
  - document_id
  references:
    name: public.documents
    columns:
    - organization_id
    - id
  on_delete: CASCADE
- name: document_likes_user_id_fkey
  columns:
  - user_id
  references:
    name: public.users
    columns:
    - id
  on_delete: CASCADE
indexes:
- name: document_likes_user_idx
  method: btree
  columns:
  - name: user_id
row_level_security:
  enabled: true
  forced: true
policies:
- name: organization_isolation
  using: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  with_check: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  comment: Rows are visible and writable only in the organization that the transaction
    sets in imbi.organization_id.

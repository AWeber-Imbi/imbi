---
name: project_syncs
schema: public
owner: imbi_owner
comment: The state of the last background sync of each type for a project. Replaces
  the commit_sync_*, deployment_sync_* and pr_sync_* properties on the Project node.
  The UI polls it for progress.
columns:
- name: organization_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The organization that owns the row. Row-level security compares it with
    imbi.organization_id. Composite foreign keys include it, so a row cannot refer
    to a row in a different organization.
- name: project_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The project that syncs.
- name: sync_type
  data_type: TEXT
  nullable: false
  comment: 'Which sync: commit (commits and tags), deployment, or pull_request.'
- name: sync_status
  data_type: TEXT
  nullable: false
  default: '''idle''::text'
  comment: idle, queued, running, success or failed. The enqueue endpoint writes
    queued; the worker writes the rest.
- name: status_at
  data_type: TIMESTAMP WITH TIME ZONE
  comment: When sync_status last changed. The deployment sync does not write queued
    when status_at is already newer, so a late write cannot replace a final status.
- name: status_by
  data_type: TEXT
  comment: The principal name that started the sync, a user email or a service principal
    name.
- name: result
  data_type: public.jsonb_object
  nullable: false
  default: '''{}''::jsonb'
  comment: Counts that the sync type reports, such as commits, tags, prs or releases_created.
    JSONB because each sync type reports different counts.
- name: error
  data_type: TEXT
  comment: The last error message, cut to 500 characters. NULL when the sync did
    not fail.
primary_key:
- project_id
- sync_type
storage_parameters:
  fillfactor: '90'
check_constraints:
- name: sync_type_valid
  expression: (sync_type = ANY (ARRAY['commit'::text, 'deployment'::text, 'pull_request'::text]))
- name: sync_status_valid
  expression: (sync_status = ANY (ARRAY['idle'::text, 'queued'::text, 'running'::text,
    'success'::text, 'failed'::text]))
foreign_keys:
- name: project_syncs_organization_id_fkey
  columns:
  - organization_id
  references:
    name: public.organizations
    columns:
    - id
  on_delete: RESTRICT
- name: project_syncs_project_id_fkey
  columns:
  - organization_id
  - project_id
  references:
    name: public.projects
    columns:
    - organization_id
    - id
  on_delete: CASCADE
row_level_security:
  enabled: true
  forced: true
policies:
- name: organization_isolation
  using: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  with_check: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  comment: Rows are visible and writable only in the organization that the transaction
    sets in imbi.organization_id.

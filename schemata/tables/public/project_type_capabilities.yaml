---
name: project_type_capabilities
schema: public
owner: imbi_owner
comment: An integration capability that projects of a type use by default. Replaces
  the USES {capability} edge from a ProjectType.
columns:
- name: organization_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The organization that owns the row. Row-level security compares it with
    imbi.organization_id. Composite foreign keys include it, so a row cannot refer
    to a row in a different organization.
- name: project_type_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The row that uses the capability.
- name: integration_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The integration that provides the capability. The capability must be enabled
    in integrations.capabilities.
- name: capability
  data_type: TEXT
  nullable: false
  comment: The capability kind, such as deployment or analysis.
- name: is_default
  data_type: BOOLEAN
  nullable: false
  default: 'false'
  comment: True picks this integration when more than one serves the same capability
    for a project. A project row wins over a project type row. Replaces the default
    edge property.
- name: options
  data_type: public.jsonb_object
  nullable: false
  default: '''{}''::jsonb'
  comment: Capability option overrides. They go over the integration options, and
    project options go over project type options.
- name: environment_payloads
  data_type: public.jsonb_object
  comment: Environment slug to a payload object, such as workflow inputs for a deployment
    to that environment. The project map goes over the project type map per environment.
    NULL means none. Replaces env_payloads.
- name: identity_integration_id
  data_type: TEXT
  collation: pg_catalog."C"
  comment: The identity integration whose connection of the acting user supplies
    credentials, so the call runs as that user. NULL means the integration credentials.
    A project value wins over a project type value. Deleting the identity integration
    sets it to NULL.
- name: created_at
  data_type: TIMESTAMP WITH TIME ZONE
  nullable: false
  default: CURRENT_TIMESTAMP
  comment: When the row was inserted. The database sets it.
- name: updated_at
  data_type: TIMESTAMP WITH TIME ZONE
  comment: When the row last changed. The set_updated_at trigger sets it on each
    UPDATE that changes the row. NULL until the first such UPDATE.
primary_key:
- project_type_id
- integration_id
- capability
foreign_keys:
- name: project_type_capabilities_organization_id_fkey
  columns:
  - organization_id
  references:
    name: public.organizations
    columns:
    - id
  on_delete: RESTRICT
- name: project_type_capabilities_project_type_id_fkey
  columns:
  - organization_id
  - project_type_id
  references:
    name: public.project_types
    columns:
    - organization_id
    - id
  on_delete: CASCADE
- name: project_type_capabilities_integration_id_fkey
  columns:
  - organization_id
  - integration_id
  references:
    name: public.integrations
    columns:
    - organization_id
    - id
  on_delete: CASCADE
- name: project_type_capabilities_identity_integration_id_fkey
  columns:
  - organization_id
  - identity_integration_id
  references:
    name: public.integrations
    columns:
    - organization_id
    - id
  on_delete: SET NULL
  on_delete_columns:
  - identity_integration_id
indexes:
- name: project_type_capabilities_integration_idx
  method: btree
  columns:
  - name: organization_id
  - name: integration_id
triggers:
- name: project_type_capabilities_set_updated_at
  when: BEFORE
  events:
  - UPDATE
  for_each: ROW
  condition: (old.* IS DISTINCT FROM new.*)
  function: public.set_updated_at()
  comment: Sets updated_at on an UPDATE that changes the row. An UPDATE that changes
    nothing keeps it.
row_level_security:
  enabled: true
  forced: true
policies:
- name: organization_isolation
  using: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  with_check: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  comment: Rows are visible and writable only in the organization that the transaction
    sets in imbi.organization_id.

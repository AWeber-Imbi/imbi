---
name: template_project_types
schema: public
owner: imbi_owner
comment: The project types a document template applies to. No rows means all project
  types. Replaces DocumentTemplate.project_type_slugs.
columns:
- name: organization_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The organization that owns the row. Row-level security compares it with
    imbi.organization_id. Composite foreign keys include it, so a row cannot refer
    to a row in a different organization.
- name: document_template_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The restricted template.
- name: project_type_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: 'A project type whose projects can use the template. RESTRICT: a project
    type that a template is restricted to cannot be deleted, because removing the
    last row would open the template to all project types.'
primary_key:
- document_template_id
- project_type_id
foreign_keys:
- name: template_project_types_organization_id_fkey
  columns:
  - organization_id
  references:
    name: public.organizations
    columns:
    - id
  on_delete: RESTRICT
- name: template_project_types_document_template_id_fkey
  columns:
  - organization_id
  - document_template_id
  references:
    name: public.document_templates
    columns:
    - organization_id
    - id
  on_delete: CASCADE
- name: template_project_types_project_type_id_fkey
  columns:
  - organization_id
  - project_type_id
  references:
    name: public.project_types
    columns:
    - organization_id
    - id
  on_delete: RESTRICT
row_level_security:
  enabled: true
  forced: true
policies:
- name: organization_isolation
  using: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  with_check: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  comment: Rows are visible and writable only in the organization that the transaction
    sets in imbi.organization_id.

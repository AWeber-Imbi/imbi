---
name: projects
schema: public
owner: imbi_owner
comment: A service, library or other unit of software that a team owns. Replaces
  the Project node.
columns:
- name: id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: Nanoid primary key. The application generates it. It does not change,
    so UI routes, API paths and other rows can refer to it.
- name: organization_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The organization that owns the row. Row-level security compares it with
    imbi.organization_id. Composite foreign keys include it, so a row cannot refer
    to a row in a different organization.
- name: team_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: 'The owning team. Replaces the OWNED_BY edge. RESTRICT: a team that owns
    projects cannot be deleted.'
- name: name
  data_type: TEXT
  nullable: false
  comment: Display name in the UI.
- name: slug
  data_type: public.slug
  nullable: false
  collation: pg_catalog."C"
  comment: 'URL-safe identifier. Not unique: two teams can have projects with the
    same slug, so API paths address projects by id.'
- name: description
  data_type: TEXT
  comment: Markdown that the detail page shows.
- name: icon
  data_type: TEXT
  comment: A URL or a CSS class name for the icon the UI shows next to the name.
- name: links
  data_type: public.jsonb_object
  nullable: false
  default: '''{}''::jsonb'
  comment: External URLs, keyed by link definition slug or integration slug. The
    Links card edits them. An integration service uses the entry with its slug as
    the dashboard URL.
- name: identifiers
  data_type: public.jsonb_object
  nullable: false
  default: '''{}''::jsonb'
  comment: Free-form map of identifier name to a string or integer value, edited
    on the project. Separate from project_integrations, which holds the identifiers
    of integration services.
- name: attributes
  data_type: public.jsonb_object
  nullable: false
  default: '''{}''::jsonb'
  comment: 'Values for the fields that enabled blueprints of this type add. The application
    validates them against the blueprint JSON schemas. Scoring policies and list
    filters read them. In the graph, these values are extra node properties. No GIN
    index: under row-level security a jsonb condition is a filter, not an index condition.'
- name: score
  data_type: NUMERIC
  comment: 'The current score, 0 to 100: the weighted average of the scoring policies
    that apply. NULL when no policy applies. The scoring queue writes it.'
- name: previous_score
  data_type: NUMERIC
  comment: The score before the last change, so the change is visible. The score
    history in ClickHouse keeps the full series.
- name: archived_at
  data_type: TIMESTAMP WITH TIME ZONE
  comment: When the project was archived. NULL while it is active. Lists hide a project
    with archived_at set by default. Replaces the graph archived flag.
- name: drift_verdicts_at
  data_type: TIMESTAMP WITH TIME ZONE
  comment: When the one-time backfill of the drift notes for this project completed.
    NULL means the backfill has not run. The backfill reads it so it runs only once.
- name: created_at
  data_type: TIMESTAMP WITH TIME ZONE
  nullable: false
  default: CURRENT_TIMESTAMP
  comment: When the row was inserted. The database sets it.
- name: updated_at
  data_type: TIMESTAMP WITH TIME ZONE
  comment: When the row last changed. The set_updated_at trigger sets it on each
    UPDATE that changes the row. NULL until the first such UPDATE.
primary_key:
- id
storage_parameters:
  fillfactor: '90'
unique_constraints:
- - organization_id
  - id
foreign_keys:
- name: projects_organization_id_fkey
  columns:
  - organization_id
  references:
    name: public.organizations
    columns:
    - id
  on_delete: RESTRICT
- name: projects_team_id_fkey
  columns:
  - organization_id
  - team_id
  references:
    name: public.teams
    columns:
    - organization_id
    - id
  on_delete: RESTRICT
indexes:
- name: projects_organization_slug_idx
  method: btree
  columns:
  - name: organization_id
  - name: slug
- name: projects_team_idx
  method: btree
  columns:
  - name: organization_id
  - name: team_id
triggers:
- name: projects_set_updated_at
  when: BEFORE
  events:
  - UPDATE
  for_each: ROW
  condition: (old.* IS DISTINCT FROM new.*)
  function: public.set_updated_at()
  comment: Sets updated_at on an UPDATE that changes the row. An UPDATE that changes
    nothing keeps it.
- name: projects_delete_embeddings
  when: AFTER
  events:
  - DELETE
  for_each: ROW
  function: public.delete_embeddings()
  arguments:
  - Project
  comment: Deletes the embeddings of a deleted Project, also when a cascade deletes
    it, so search cannot find its text.
row_level_security:
  enabled: true
  forced: true
policies:
- name: organization_isolation
  using: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  with_check: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  comment: Rows are visible and writable only in the organization that the transaction
    sets in imbi.organization_id.

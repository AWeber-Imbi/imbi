---
name: ai_providers
schema: public
owner: imbi_owner
comment: An LLM vendor account that an organization configured. It serves the models
  in ai_models. A new organization has none. Replaces the AIProvider node.
columns:
- name: id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: Nanoid primary key. The application generates it. It does not change,
    so UI routes, API paths and other rows can refer to it.
- name: organization_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The organization that owns the row. Row-level security compares it with
    imbi.organization_id. Composite foreign keys include it, so a row cannot refer
    to a row in a different organization.
- name: name
  data_type: TEXT
  nullable: false
  comment: Display name in the UI.
- name: slug
  data_type: public.slug
  nullable: false
  collation: pg_catalog."C"
  comment: URL-safe identifier. UI routes and API paths use it.
- name: description
  data_type: TEXT
  comment: Markdown that the detail page shows.
- name: icon
  data_type: TEXT
  comment: A URL or a CSS class name for the icon the UI shows next to the name.
- name: driver
  data_type: TEXT
  nullable: false
  comment: 'The client code that talks to the vendor: anthropic, openai, openai_compatible,
    bedrock or vertex. The driver catalog is static code.'
- name: base_url
  data_type: TEXT
  comment: An http or https endpoint without embedded credentials. NULL means the
    driver default. openai_compatible has no default, so it must have one.
- name: enabled
  data_type: BOOLEAN
  nullable: false
  default: 'true'
  comment: False turns the provider off without deleting it.
- name: credentials_encrypted
  data_type: TEXT
  comment: Fernet ciphertext of the API key. The API never returns it. NULL when
    no key is set.
- name: credential_hint
  data_type: TEXT
  comment: The last four characters of the API key, in clear text, so an admin can
    tell two keys apart.
- name: credential_updated_at
  data_type: TIMESTAMP WITH TIME ZONE
  comment: When an admin last set the API key. NULL when no key is set.
- name: region
  data_type: TEXT
  comment: The cloud region for the bedrock and vertex drivers. NULL for other drivers.
- name: cloud_project_id
  data_type: TEXT
  collation: pg_catalog."C"
  comment: The Google Cloud project for the vertex driver. Renamed from AIProvider.project_id
    so it is not confused with projects.id.
- name: created_at
  data_type: TIMESTAMP WITH TIME ZONE
  nullable: false
  default: CURRENT_TIMESTAMP
  comment: When the row was inserted. The database sets it.
- name: updated_at
  data_type: TIMESTAMP WITH TIME ZONE
  comment: When the row last changed. The set_updated_at trigger sets it on each
    UPDATE that changes the row. NULL until the first such UPDATE.
primary_key:
- id
unique_constraints:
- - organization_id
  - id
- - organization_id
  - slug
check_constraints:
- name: driver_valid
  expression: (driver = ANY (ARRAY['anthropic'::text, 'openai'::text, 'openai_compatible'::text,
    'bedrock'::text, 'vertex'::text]))
- name: compatible_has_url
  expression: ((driver <> 'openai_compatible'::text) OR (base_url IS NOT NULL))
foreign_keys:
- name: ai_providers_organization_id_fkey
  columns:
  - organization_id
  references:
    name: public.organizations
    columns:
    - id
  on_delete: RESTRICT
triggers:
- name: ai_providers_set_updated_at
  when: BEFORE
  events:
  - UPDATE
  for_each: ROW
  condition: (old.* IS DISTINCT FROM new.*)
  function: public.set_updated_at()
  comment: Sets updated_at on an UPDATE that changes the row. An UPDATE that changes
    nothing keeps it.
- name: ai_providers_delete_embeddings
  when: AFTER
  events:
  - DELETE
  for_each: ROW
  function: public.delete_embeddings()
  arguments:
  - AIProvider
  comment: Deletes the embeddings of a deleted AIProvider, also when a cascade deletes
    it, so search cannot find its text.
row_level_security:
  enabled: true
  forced: true
policies:
- name: organization_isolation
  using: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  with_check: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  comment: Rows are visible and writable only in the organization that the transaction
    sets in imbi.organization_id.

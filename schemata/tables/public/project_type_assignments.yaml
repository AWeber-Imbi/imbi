---
name: project_type_assignments
schema: public
owner: imbi_owner
comment: The project types of a project. Replaces the TYPE edge. Blueprints, tag
  formats and scoring use the types of a project.
columns:
- name: organization_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The organization that owns the row. Row-level security compares it with
    imbi.organization_id. Composite foreign keys include it, so a row cannot refer
    to a row in a different organization.
- name: project_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The project. The row goes when the project is deleted.
- name: project_type_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: 'A type of the project. RESTRICT: a type in use cannot be deleted.'
- name: created_at
  data_type: TIMESTAMP WITH TIME ZONE
  nullable: false
  default: CURRENT_TIMESTAMP
  comment: When the row was inserted. The database sets it.
primary_key:
- project_id
- project_type_id
foreign_keys:
- name: project_type_assignments_organization_id_fkey
  columns:
  - organization_id
  references:
    name: public.organizations
    columns:
    - id
  on_delete: RESTRICT
- name: project_type_assignments_project_id_fkey
  columns:
  - organization_id
  - project_id
  references:
    name: public.projects
    columns:
    - organization_id
    - id
  on_delete: CASCADE
- name: project_type_assignments_project_type_id_fkey
  columns:
  - organization_id
  - project_type_id
  references:
    name: public.project_types
    columns:
    - organization_id
    - id
  on_delete: RESTRICT
indexes:
- name: project_type_assignments_type_idx
  method: btree
  columns:
  - name: organization_id
  - name: project_type_id
row_level_security:
  enabled: true
  forced: true
policies:
- name: organization_isolation
  using: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  with_check: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  comment: Rows are visible and writable only in the organization that the transaction
    sets in imbi.organization_id.

---
name: uploads
schema: public
owner: imbi_owner
comment: Metadata for a file in object storage, such as an image in a document. Documents
  refer to it by its API URL. Replaces the Upload node.
columns:
- name: id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: A UUID string that the upload endpoint generates. The read URL and the
    storage key contain it.
- name: organization_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The organization that owns the row. Row-level security compares it with
    imbi.organization_id. Composite foreign keys include it, so a row cannot refer
    to a row in a different organization.
- name: filename
  data_type: TEXT
  nullable: false
  comment: The file name the client sent. The metadata response returns it. The storage
    key uses a cleaned copy.
- name: content_type
  data_type: TEXT
  nullable: false
  comment: The MIME type. The API accepts only the types in the S3_ALLOWED_CONTENT_TYPES
    setting, so the table does not repeat the list.
- name: file_size
  data_type: BIGINT
  nullable: false
  comment: The file size in bytes. The API applies the S3_MAX_FILE_SIZE setting,
    so the table checks only that it is not negative.
- name: storage_key
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: 'The S3 object key of the file: uploads/<id>/<clean file name>. Replaces
    Upload.s3_key.'
- name: thumbnail_storage_key
  data_type: TEXT
  comment: The S3 key of a WebP thumbnail. NULL when the file has no thumbnail, for
    example a PDF or a failed resize. Replaces Upload.has_thumbnail and thumbnail_s3_key.
- name: uploaded_by
  data_type: TEXT
  nullable: false
  comment: The email of the user that uploaded the file. The upload list filters
    on it.
- name: created_at
  data_type: TIMESTAMP WITH TIME ZONE
  nullable: false
  default: CURRENT_TIMESTAMP
  comment: When the row was inserted. The database sets it.
primary_key:
- id
unique_constraints:
- - storage_key
check_constraints:
- name: file_size_range
  expression: (file_size >= 0)
foreign_keys:
- name: uploads_organization_id_fkey
  columns:
  - organization_id
  references:
    name: public.organizations
    columns:
    - id
  on_delete: RESTRICT
row_level_security:
  enabled: true
  forced: true
policies:
- name: organization_isolation
  using: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  with_check: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  comment: Rows are visible and writable only in the organization that the transaction
    sets in imbi.organization_id.

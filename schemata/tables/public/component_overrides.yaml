---
name: component_overrides
schema: public
owner: imbi_owner
comment: The values of a component from this organization's SBOMs, where they differ
  from the shared catalog row. The first SBOM that names a package sets the catalog
  values for all organizations. A later SBOM with the same values writes nothing
  here. Readers use a value from this table where it is not NULL. Search embeds the
  catalog values.
columns:
- name: organization_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The organization that owns the row. Row-level security compares it with
    imbi.organization_id. Composite foreign keys include it, so a row cannot refer
    to a row in a different organization.
- name: component_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The component.
- name: name
  data_type: TEXT
  comment: The package name from the SBOMs of this organization. NULL means the catalog
    name.
- name: description
  data_type: TEXT
  comment: The package description from the SBOMs of this organization. NULL means
    the catalog description.
- name: created_at
  data_type: TIMESTAMP WITH TIME ZONE
  nullable: false
  default: CURRENT_TIMESTAMP
  comment: When the row was inserted. The database sets it.
- name: updated_at
  data_type: TIMESTAMP WITH TIME ZONE
  comment: When the row last changed. The set_updated_at trigger sets it on each
    UPDATE that changes the row. NULL until the first such UPDATE.
primary_key:
- organization_id
- component_id
check_constraints:
- name: has_override
  expression: (num_nonnulls(name, description) >= 1)
foreign_keys:
- name: component_overrides_organization_id_fkey
  columns:
  - organization_id
  references:
    name: public.organizations
    columns:
    - id
  on_delete: RESTRICT
- name: component_overrides_component_id_fkey
  columns:
  - component_id
  references:
    name: public.components
    columns:
    - id
  on_delete: RESTRICT
triggers:
- name: component_overrides_set_updated_at
  when: BEFORE
  events:
  - UPDATE
  for_each: ROW
  condition: (old.* IS DISTINCT FROM new.*)
  function: public.set_updated_at()
  comment: Sets updated_at on an UPDATE that changes the row. An UPDATE that changes
    nothing keeps it.
row_level_security:
  enabled: true
  forced: true
policies:
- name: organization_isolation
  using: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  with_check: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  comment: Rows are visible and writable only in the organization that the transaction
    sets in imbi.organization_id.

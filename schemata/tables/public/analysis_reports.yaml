---
name: analysis_reports
schema: public
owner: imbi_owner
comment: The latest Project Doctor report for a project. A new run replaces the old
  report in one transaction, so a project has at most one. Replaces the AnalysisReport
  node.
columns:
- name: id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: Nanoid primary key. The application generates it. It does not change,
    so UI routes, API paths and other rows can refer to it.
- name: organization_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The organization that owns the row. Row-level security compares it with
    imbi.organization_id. Composite foreign keys include it, so a row cannot refer
    to a row in a different organization.
- name: project_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The analyzed project. Unique, one report per project.
- name: overall_status
  data_type: TEXT
  nullable: false
  comment: 'The worst status of the results: fail over warn over pass. pass when
    there are no results.'
- name: triggered_by
  data_type: TEXT
  collation: pg_catalog."C"
  comment: The user who started the run. NULL when a service account started it,
    or when the user was deleted. Replaces AnalysisReport.triggered_by_user_id.
- name: created_at
  data_type: TIMESTAMP WITH TIME ZONE
  nullable: false
  default: CURRENT_TIMESTAMP
  comment: When the row was inserted. The database sets it.
primary_key:
- id
unique_constraints:
- - organization_id
  - id
- - project_id
check_constraints:
- name: overall_status_valid
  expression: (overall_status = ANY (ARRAY['pass'::text, 'warn'::text, 'fail'::text]))
foreign_keys:
- name: analysis_reports_organization_id_fkey
  columns:
  - organization_id
  references:
    name: public.organizations
    columns:
    - id
  on_delete: RESTRICT
- name: analysis_reports_project_id_fkey
  columns:
  - organization_id
  - project_id
  references:
    name: public.projects
    columns:
    - organization_id
    - id
  on_delete: CASCADE
- name: analysis_reports_triggered_by_fkey
  columns:
  - triggered_by
  references:
    name: public.users
    columns:
    - id
  on_delete: SET NULL
row_level_security:
  enabled: true
  forced: true
policies:
- name: organization_isolation
  using: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  with_check: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  comment: Rows are visible and writable only in the organization that the transaction
    sets in imbi.organization_id.

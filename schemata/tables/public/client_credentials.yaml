---
name: client_credentials
schema: public
owner: imbi_owner
comment: An OAuth2 client_credentials secret of a service account. The token endpoint
  exchanges it for a JWT pair. The graph ClientCredential label.
columns:
- name: id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: Nanoid primary key. The application generates it. It does not change,
    so UI routes, API paths and other rows can refer to it.
- name: service_account_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The owning service account. Replaces the OWNED_BY edge.
- name: client_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The public identifier, cc_<random>. The token endpoint finds the row by
    it.
- name: client_secret_hash
  data_type: TEXT
  nullable: false
  comment: Argon2id hash of the client secret. The secret is not stored.
- name: name
  data_type: TEXT
  nullable: false
  comment: The name that the administrator gives the credential.
- name: description
  data_type: TEXT
  comment: What the credential is for.
- name: scopes
  data_type: TEXT[]
  nullable: false
  default: '''{}''::text[]'
  comment: Permission names that a token from this credential can carry. The token
    gets the requested scopes that are in this list. Empty means no limit.
- name: expires_at
  data_type: TIMESTAMP WITH TIME ZONE
  comment: When the credential stops working. NULL means no expiry.
- name: last_used_at
  data_type: TIMESTAMP WITH TIME ZONE
  comment: When the credential last got a token.
- name: last_rotated_at
  data_type: TIMESTAMP WITH TIME ZONE
  comment: When the secret was last replaced. NULL until the first rotation.
- name: revoked_at
  data_type: TIMESTAMP WITH TIME ZONE
  comment: When the credential was revoked. NULL while it is valid. The token endpoint
    rejects a credential with revoked_at set. Replaces the graph revoked flag.
- name: created_at
  data_type: TIMESTAMP WITH TIME ZONE
  nullable: false
  default: CURRENT_TIMESTAMP
  comment: When the row was inserted. The database sets it.
- name: updated_at
  data_type: TIMESTAMP WITH TIME ZONE
  comment: When the row last changed. The set_updated_at trigger sets it on each
    UPDATE that changes the row. NULL until the first such UPDATE.
primary_key:
- id
unique_constraints:
- - client_id
foreign_keys:
- name: client_credentials_service_account_id_fkey
  columns:
  - service_account_id
  references:
    name: public.service_accounts
    columns:
    - id
  on_delete: CASCADE
indexes:
- name: client_credentials_account_idx
  method: btree
  columns:
  - name: service_account_id
triggers:
- name: client_credentials_set_updated_at
  when: BEFORE
  events:
  - UPDATE
  for_each: ROW
  condition: (old.* IS DISTINCT FROM new.*)
  function: public.set_updated_at()
  comment: Sets updated_at on an UPDATE that changes the row. An UPDATE that changes
    nothing keeps it.
row_level_security:
  enabled: false

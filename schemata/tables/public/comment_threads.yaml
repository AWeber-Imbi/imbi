---
name: comment_threads
schema: public
owner: imbi_owner
comment: A discussion on a document, about the whole page or about a quoted passage.
  Replaces the CommentThread node and its ON_DOCUMENT edge.
columns:
- name: id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: Nanoid primary key. The application generates it. It does not change,
    so UI routes, API paths and other rows can refer to it.
- name: organization_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The organization that owns the row. Row-level security compares it with
    imbi.organization_id. Composite foreign keys include it, so a row cannot refer
    to a row in a different organization.
- name: document_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The document the thread is on.
- name: kind
  data_type: TEXT
  nullable: false
  default: '''page''::text'
  comment: page for a discussion of the whole document, inline for a discussion of
    a selected passage.
- name: anchor_quote
  data_type: TEXT
  nullable: false
  default: '''''::text'
  comment: For an inline thread, the exact selected text. The UI finds it in the
    rendered document to show the highlight. Empty for a page thread.
- name: anchor_prefix
  data_type: TEXT
  nullable: false
  default: '''''::text'
  comment: For an inline thread, about 32 characters of rendered text before the
    quote. It tells two equal quotes apart. Empty for a page thread.
- name: anchor_suffix
  data_type: TEXT
  nullable: false
  default: '''''::text'
  comment: For an inline thread, about 32 characters of rendered text after the quote.
    Empty for a page thread.
- name: anchor_start
  data_type: INTEGER
  nullable: false
  default: '0'
  comment: For an inline thread, the character offset of the quote in the rendered
    text, not in the Markdown source. 0 for a page thread.
- name: resolved_by
  data_type: TEXT
  comment: The principal name (user email or service account slug) that resolved
    the thread. NULL while it is open.
- name: resolved_at
  data_type: TIMESTAMP WITH TIME ZONE
  comment: When a user marked the discussion as done. NULL while it is open. Replaces
    the graph resolved flag.
- name: created_by
  data_type: TEXT
  nullable: false
  comment: The principal name (user email or service account slug) that started the
    thread.
- name: created_at
  data_type: TIMESTAMP WITH TIME ZONE
  nullable: false
  default: CURRENT_TIMESTAMP
  comment: When the row was inserted. The database sets it.
- name: updated_at
  data_type: TIMESTAMP WITH TIME ZONE
  comment: When the row last changed. The set_updated_at trigger sets it on each
    UPDATE that changes the row. NULL until the first such UPDATE.
primary_key:
- id
unique_constraints:
- - organization_id
  - id
check_constraints:
- name: kind_valid
  expression: (kind = ANY (ARRAY['page'::text, 'inline'::text]))
- name: inline_has_quote
  expression: ((kind <> 'inline'::text) OR (anchor_quote <> ''::text))
foreign_keys:
- name: comment_threads_organization_id_fkey
  columns:
  - organization_id
  references:
    name: public.organizations
    columns:
    - id
  on_delete: RESTRICT
- name: comment_threads_document_id_fkey
  columns:
  - organization_id
  - document_id
  references:
    name: public.documents
    columns:
    - organization_id
    - id
  on_delete: CASCADE
indexes:
- name: comment_threads_document_idx
  method: btree
  columns:
  - name: organization_id
  - name: document_id
  - name: created_at
triggers:
- name: comment_threads_set_updated_at
  when: BEFORE
  events:
  - UPDATE
  for_each: ROW
  condition: (old.* IS DISTINCT FROM new.*)
  function: public.set_updated_at()
  comment: Sets updated_at on an UPDATE that changes the row. An UPDATE that changes
    nothing keeps it.
row_level_security:
  enabled: true
  forced: true
policies:
- name: organization_isolation
  using: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  with_check: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  comment: Rows are visible and writable only in the organization that the transaction
    sets in imbi.organization_id.

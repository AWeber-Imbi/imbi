---
name: password_reset_tokens
schema: public
owner: imbi_owner
comment: A single-use password reset token for the reset email. The graph PasswordResetToken
  label. No endpoint sends the reset email today.
columns:
- name: id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: Nanoid primary key. The application generates it. It does not change,
    so UI routes, API paths and other rows can refer to it.
- name: user_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The user whose password the token resets. Replaces the username and email
    properties.
- name: token_hash
  data_type: TEXT
  nullable: false
  comment: A hash of the emailed token, never the token, so a database read cannot
    reset a password. The graph stores the token itself.
- name: expires_at
  data_type: TIMESTAMP WITH TIME ZONE
  nullable: false
  comment: When the token stops working, 24 hours after issue.
- name: used_at
  data_type: TIMESTAMP WITH TIME ZONE
  comment: When the token was used. NULL while it is unused. Replaces the used flag.
- name: created_at
  data_type: TIMESTAMP WITH TIME ZONE
  nullable: false
  default: CURRENT_TIMESTAMP
  comment: When the row was inserted. The database sets it.
primary_key:
- id
unique_constraints:
- - token_hash
foreign_keys:
- name: password_reset_tokens_user_id_fkey
  columns:
  - user_id
  references:
    name: public.users
    columns:
    - id
  on_delete: CASCADE
row_level_security:
  enabled: false

---
name: document_tags
schema: public
owner: imbi_owner
comment: A tag on a document. Replaces the TAGGED_WITH edge from a Document. A change
  to the tag set cuts a new document version.
columns:
- name: organization_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The organization that owns the row. Row-level security compares it with
    imbi.organization_id. Composite foreign keys include it, so a row cannot refer
    to a row in a different organization.
- name: document_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The tagged document.
- name: tag_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The tag. The documents page filters on it.
primary_key:
- document_id
- tag_id
foreign_keys:
- name: document_tags_organization_id_fkey
  columns:
  - organization_id
  references:
    name: public.organizations
    columns:
    - id
  on_delete: RESTRICT
- name: document_tags_document_id_fkey
  columns:
  - organization_id
  - document_id
  references:
    name: public.documents
    columns:
    - organization_id
    - id
  on_delete: CASCADE
- name: document_tags_tag_id_fkey
  columns:
  - organization_id
  - tag_id
  references:
    name: public.tags
    columns:
    - organization_id
    - id
  on_delete: CASCADE
indexes:
- name: document_tags_tag_idx
  method: btree
  columns:
  - name: organization_id
  - name: tag_id
row_level_security:
  enabled: true
  forced: true
policies:
- name: organization_isolation
  using: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  with_check: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  comment: Rows are visible and writable only in the organization that the transaction
    sets in imbi.organization_id.

---
name: project_integrations
schema: public
owner: imbi_owner
comment: A project that exists in an external service, such as a GitHub repository
  or a SonarQube project. Replaces the EXISTS_IN edge. Lifecycle capabilities write
  it, and plugins read it to find the remote project.
columns:
- name: organization_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The organization that owns the row. Row-level security compares it with
    imbi.organization_id. Composite foreign keys include it, so a row cannot refer
    to a row in a different organization.
- name: project_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The Imbi project.
- name: integration_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The integration that holds the remote project.
- name: identifier
  data_type: TEXT
  nullable: false
  comment: The stable id of the project in the remote, such as a GitHub repository
    id. The gateway finds the project for an inbound webhook with it.
- name: canonical_url
  data_type: TEXT
  comment: The API URL of the remote project, which returns JSON. An id-based URL
    does not change when the remote is renamed. NULL for a link made before plugins
    kept this URL. The human dashboard URL is in projects.links.
- name: webhook_secret_encrypted
  data_type: TEXT
  comment: Fernet ciphertext of the signing secret for webhooks about this project,
    such as a PagerDuty subscription secret. When set, the gateway drops a delivery
    without a valid HMAC signature. Replaces the webhook_secret_enc edge property.
- name: created_at
  data_type: TIMESTAMP WITH TIME ZONE
  nullable: false
  default: CURRENT_TIMESTAMP
  comment: When the row was inserted. The database sets it.
- name: updated_at
  data_type: TIMESTAMP WITH TIME ZONE
  comment: When the row last changed. The set_updated_at trigger sets it on each
    UPDATE that changes the row. NULL until the first such UPDATE.
primary_key:
- project_id
- integration_id
check_constraints:
- name: identifier_not_empty
  expression: (identifier <> ''::text)
foreign_keys:
- name: project_integrations_organization_id_fkey
  columns:
  - organization_id
  references:
    name: public.organizations
    columns:
    - id
  on_delete: RESTRICT
- name: project_integrations_project_id_fkey
  columns:
  - organization_id
  - project_id
  references:
    name: public.projects
    columns:
    - organization_id
    - id
  on_delete: CASCADE
- name: project_integrations_integration_id_fkey
  columns:
  - organization_id
  - integration_id
  references:
    name: public.integrations
    columns:
    - organization_id
    - id
  on_delete: CASCADE
indexes:
- name: project_integrations_ident_idx
  method: btree
  columns:
  - name: integration_id
  - name: identifier
triggers:
- name: project_integrations_set_updated_at
  when: BEFORE
  events:
  - UPDATE
  for_each: ROW
  condition: (old.* IS DISTINCT FROM new.*)
  function: public.set_updated_at()
  comment: Sets updated_at on an UPDATE that changes the row. An UPDATE that changes
    nothing keeps it.
row_level_security:
  enabled: true
  forced: true
policies:
- name: organization_isolation
  using: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  with_check: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  comment: Rows are visible and writable only in the organization that the transaction
    sets in imbi.organization_id.

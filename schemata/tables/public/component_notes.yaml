---
name: component_notes
schema: public
owner: imbi_owner
comment: A note that an organization wrote about a component version, such as why
  it is deprecated, how to migrate, or who to ask. It is the governance audit trail,
  so no one edits or deletes it. Replaces the ComponentNote node and its HAS_NOTE
  edge.
columns:
- name: id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: Nanoid primary key. The application generates it. It does not change,
    so UI routes, API paths and other rows can refer to it.
- name: organization_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The organization that owns the row. Row-level security compares it with
    imbi.organization_id. Composite foreign keys include it, so a row cannot refer
    to a row in a different organization.
- name: component_release_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The component version that the note is about.
- name: author
  data_type: TEXT
  nullable: false
  comment: The user email or service account slug that wrote the note.
- name: body
  data_type: TEXT
  nullable: false
  comment: The note as Markdown, 1 to 2000 characters. Search embeds it in chunks.
- name: created_at
  data_type: TIMESTAMP WITH TIME ZONE
  nullable: false
  default: CURRENT_TIMESTAMP
  comment: When the row was inserted. The database sets it.
primary_key:
- id
check_constraints:
- name: body_length
  expression: ((char_length(body) >= 1) AND (char_length(body) <= 2000))
foreign_keys:
- name: component_notes_organization_id_fkey
  columns:
  - organization_id
  references:
    name: public.organizations
    columns:
    - id
  on_delete: RESTRICT
- name: component_notes_component_release_id_fkey
  columns:
  - component_release_id
  references:
    name: public.component_releases
    columns:
    - id
  on_delete: RESTRICT
indexes:
- name: component_notes_release_idx
  method: btree
  columns:
  - name: organization_id
  - name: component_release_id
  - name: created_at
triggers:
- name: component_notes_delete_embeddings
  when: AFTER
  events:
  - DELETE
  for_each: ROW
  function: public.delete_embeddings()
  arguments:
  - ComponentNote
  comment: Deletes the embeddings of a deleted ComponentNote, also when a cascade
    deletes it, so search cannot find its text.
row_level_security:
  enabled: true
  forced: true
policies:
- name: organization_isolation
  using: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  with_check: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  comment: Rows are visible and writable only in the organization that the transaction
    sets in imbi.organization_id.

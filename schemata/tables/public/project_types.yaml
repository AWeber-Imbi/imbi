---
name: project_types
schema: public
owner: imbi_owner
comment: A classification of projects, such as API or library. Replaces the ProjectType
  node. Blueprints and scoring policies can target a type.
columns:
- name: id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: Nanoid primary key. The application generates it. It does not change,
    so UI routes, API paths and other rows can refer to it.
- name: organization_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The organization that owns the row. Row-level security compares it with
    imbi.organization_id. Composite foreign keys include it, so a row cannot refer
    to a row in a different organization.
- name: name
  data_type: TEXT
  nullable: false
  comment: Display name in the UI.
- name: slug
  data_type: public.slug
  nullable: false
  collation: pg_catalog."C"
  comment: URL-safe identifier. UI routes and API paths use it.
- name: description
  data_type: TEXT
  comment: Markdown that the detail page shows.
- name: icon
  data_type: TEXT
  comment: A URL or a CSS class name for the icon the UI shows next to the name.
- name: deployable
  data_type: BOOLEAN
  nullable: false
  default: 'false'
  comment: Projects of this type deploy into environments and show the Deployments
    tab. Cannot be true with releasable.
- name: releasable
  data_type: BOOLEAN
  nullable: false
  default: 'false'
  comment: Projects of this type publish an artifact with a tag and a release, with
    no deploy step, and show the Releases tab.
- name: tag_formats
  data_type: public.jsonb_array
  nullable: false
  default: '''[]''::jsonb'
  comment: Release tag policy for projects of this type, as a list of {label, pattern}
    objects. When a project has types with formats, the union applies. Empty means
    the organization tag_formats apply.
- name: attributes
  data_type: public.jsonb_object
  nullable: false
  default: '''{}''::jsonb'
  comment: 'Values for the fields that enabled blueprints of this type add. The application
    validates them against the blueprint JSON schemas. Scoring policies and list
    filters read them. In the graph, these values are extra node properties. No GIN
    index: under row-level security a jsonb condition is a filter, not an index condition.'
- name: created_at
  data_type: TIMESTAMP WITH TIME ZONE
  nullable: false
  default: CURRENT_TIMESTAMP
  comment: When the row was inserted. The database sets it.
- name: updated_at
  data_type: TIMESTAMP WITH TIME ZONE
  comment: When the row last changed. The set_updated_at trigger sets it on each
    UPDATE that changes the row. NULL until the first such UPDATE.
primary_key:
- id
unique_constraints:
- - organization_id
  - id
- - organization_id
  - slug
check_constraints:
- name: deployable_or_releasable
  expression: (NOT (deployable AND releasable))
foreign_keys:
- name: project_types_organization_id_fkey
  columns:
  - organization_id
  references:
    name: public.organizations
    columns:
    - id
  on_delete: RESTRICT
triggers:
- name: project_types_set_updated_at
  when: BEFORE
  events:
  - UPDATE
  for_each: ROW
  condition: (old.* IS DISTINCT FROM new.*)
  function: public.set_updated_at()
  comment: Sets updated_at on an UPDATE that changes the row. An UPDATE that changes
    nothing keeps it.
- name: project_types_delete_embeddings
  when: AFTER
  events:
  - DELETE
  for_each: ROW
  function: public.delete_embeddings()
  arguments:
  - ProjectType
  comment: Deletes the embeddings of a deleted ProjectType, also when a cascade deletes
    it, so search cannot find its text.
row_level_security:
  enabled: true
  forced: true
policies:
- name: organization_isolation
  using: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  with_check: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  comment: Rows are visible and writable only in the organization that the transaction
    sets in imbi.organization_id.

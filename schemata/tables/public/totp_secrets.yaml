---
name: totp_secrets
schema: public
owner: imbi_owner
comment: The TOTP second factor of a user. A user has at most one. When it is enabled,
  password sign-in requires a TOTP code or a backup code. The graph TOTPSecret label
  and its MFA_FOR edge.
columns:
- name: user_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The user who owns the factor.
- name: secret_encrypted
  data_type: TEXT
  nullable: false
  comment: Fernet ciphertext of the base32 TOTP seed. The API decrypts it to verify
    a code.
- name: enabled
  data_type: BOOLEAN
  nullable: false
  default: 'false'
  comment: False after setup. True after the user verifies the first code. Sign-in
    requires a code only when this is true.
- name: backup_code_hashes
  data_type: TEXT[]
  nullable: false
  default: '''{}''::text[]'
  comment: Argon2id hashes of the unused backup codes. A code is removed from the
    list when it is used, so each code works once.
- name: last_used_at
  data_type: TIMESTAMP WITH TIME ZONE
  comment: When a code was last verified.
- name: created_at
  data_type: TIMESTAMP WITH TIME ZONE
  nullable: false
  default: CURRENT_TIMESTAMP
  comment: When the row was inserted. The database sets it.
- name: updated_at
  data_type: TIMESTAMP WITH TIME ZONE
  comment: When the row last changed. The set_updated_at trigger sets it on each
    UPDATE that changes the row. NULL until the first such UPDATE.
primary_key:
- user_id
foreign_keys:
- name: totp_secrets_user_id_fkey
  columns:
  - user_id
  references:
    name: public.users
    columns:
    - id
  on_delete: CASCADE
triggers:
- name: totp_secrets_set_updated_at
  when: BEFORE
  events:
  - UPDATE
  for_each: ROW
  condition: (old.* IS DISTINCT FROM new.*)
  function: public.set_updated_at()
  comment: Sets updated_at on an UPDATE that changes the row. An UPDATE that changes
    nothing keeps it.
row_level_security:
  enabled: false

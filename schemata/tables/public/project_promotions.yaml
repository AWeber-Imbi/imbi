---
name: project_promotions
schema: public
owner: imbi_owner
comment: The state of the last release promotion for a project. Replaces the promote_*
  properties on the Project node. The UI polls it while the build and the rollout
  run.
columns:
- name: organization_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The organization that owns the row. Row-level security compares it with
    imbi.organization_id. Composite foreign keys include it, so a row cannot refer
    to a row in a different organization.
- name: project_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: 'The project. One row per project: a new promote replaces the last one.'
- name: promotion_status
  data_type: TEXT
  nullable: false
  default: '''idle''::text'
  comment: idle, building, deploying, success, build_failed, deploy_failed or failed.
    The promote worker advances it.
- name: status_at
  data_type: TIMESTAMP WITH TIME ZONE
  comment: When promotion_status last changed.
- name: status_by
  data_type: TEXT
  comment: The principal name of the person who started the promote. The deployment
    event and the operations log use it for attribution.
- name: tag
  data_type: TEXT
  comment: The release tag that the promote cuts.
- name: committish
  data_type: TEXT
  collation: pg_catalog."C"
  comment: The commit that the tag points at.
- name: environment_id
  data_type: TEXT
  collation: pg_catalog."C"
  comment: 'The target environment. NULL when the build does not deploy. In the graph,
    this is an environment slug. RESTRICT: an environment in a promotion cannot be
    deleted.'
- name: from_environment_id
  data_type: TEXT
  collation: pg_catalog."C"
  comment: The environment the release is promoted from. NULL when the build has
    no source environment. RESTRICT, as for environment_id.
- name: run_id
  data_type: TEXT
  collation: pg_catalog."C"
  comment: The provider ID of the release build run, such as a GitHub Actions run.
    NULL when the dispatch did not return one.
- name: run_url
  data_type: TEXT
  comment: Link to the build run for the UI.
- name: error
  data_type: TEXT
  comment: The last error message, cut to 500 characters. NULL when the promote did
    not fail.
primary_key:
- project_id
storage_parameters:
  fillfactor: '90'
check_constraints:
- name: promotion_status_valid
  expression: (promotion_status = ANY (ARRAY['idle'::text, 'building'::text, 'deploying'::text,
    'success'::text, 'build_failed'::text, 'deploy_failed'::text, 'failed'::text]))
foreign_keys:
- name: project_promotions_organization_id_fkey
  columns:
  - organization_id
  references:
    name: public.organizations
    columns:
    - id
  on_delete: RESTRICT
- name: project_promotions_project_id_fkey
  columns:
  - organization_id
  - project_id
  references:
    name: public.projects
    columns:
    - organization_id
    - id
  on_delete: CASCADE
- name: project_promotions_environment_id_fkey
  columns:
  - organization_id
  - environment_id
  references:
    name: public.environments
    columns:
    - organization_id
    - id
  on_delete: RESTRICT
- name: project_promotions_from_environment_id_fkey
  columns:
  - organization_id
  - from_environment_id
  references:
    name: public.environments
    columns:
    - organization_id
    - id
  on_delete: RESTRICT
indexes:
- name: project_promotions_environment_idx
  method: btree
  columns:
  - name: organization_id
  - name: environment_id
  where: (environment_id IS NOT NULL)
- name: project_promotions_from_environment_idx
  method: btree
  columns:
  - name: organization_id
  - name: from_environment_id
  where: (from_environment_id IS NOT NULL)
row_level_security:
  enabled: true
  forced: true
policies:
- name: organization_isolation
  using: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  with_check: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  comment: Rows are visible and writable only in the organization that the transaction
    sets in imbi.organization_id.

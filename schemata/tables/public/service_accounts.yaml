---
name: service_accounts
schema: public
owner: imbi_owner
comment: A non-human principal, for machine-to-machine access and for the Imbi services
  themselves. Access to an organization comes from a membership, the same as for
  a user.
columns:
- name: id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: Nanoid primary key. The application generates it. It does not change,
    so UI routes, API paths and other rows can refer to it.
- name: principal_type
  data_type: TEXT
  nullable: false
  default: '''service_account''::text'
  comment: Always service_account. The foreign key to principals includes it, so
    one principal id cannot be both a user and a service account.
- name: slug
  data_type: public.slug
  nullable: false
  collation: pg_catalog."C"
  comment: The stable name of the account. It is the JWT subject of client_credentials
    tokens, and token validation finds the account by it.
- name: display_name
  data_type: TEXT
  nullable: false
  comment: The name that the UI shows for the account.
- name: description
  data_type: TEXT
  comment: What the account is for. Shown on the admin pages.
- name: is_active
  data_type: BOOLEAN
  nullable: false
  default: 'true'
  comment: False makes client credentials, tokens and API keys of the account fail
    authentication.
- name: avatar_url
  data_type: TEXT
  comment: Image URL that the UI shows for the account.
- name: last_authenticated_at
  data_type: TIMESTAMP WITH TIME ZONE
  comment: When the account last got a token. The client credentials token exchange
    sets it. The graph property is ServiceAccount.last_authenticated.
- name: created_at
  data_type: TIMESTAMP WITH TIME ZONE
  nullable: false
  default: CURRENT_TIMESTAMP
  comment: When the row was inserted. The database sets it.
- name: updated_at
  data_type: TIMESTAMP WITH TIME ZONE
  comment: When the row last changed. The set_updated_at trigger sets it on each
    UPDATE that changes the row. NULL until the first such UPDATE.
primary_key:
- id
unique_constraints:
- - slug
check_constraints:
- name: principal_type_valid
  expression: (principal_type = 'service_account'::text)
- name: slug_valid
  expression: ((slug)::text ~ '^[a-z][a-z0-9-]{1,63}$'::text)
foreign_keys:
- name: service_accounts_id_principal_type_fkey
  columns:
  - id
  - principal_type
  references:
    name: public.principals
    columns:
    - id
    - principal_type
  on_delete: CASCADE
triggers:
- name: service_accounts_set_updated_at
  when: BEFORE
  events:
  - UPDATE
  for_each: ROW
  condition: (old.* IS DISTINCT FROM new.*)
  function: public.set_updated_at()
  comment: Sets updated_at on an UPDATE that changes the row. An UPDATE that changes
    nothing keeps it.
- name: service_accounts_delete_principal
  when: AFTER
  events:
  - DELETE
  for_each: ROW
  function: public.delete_principal()
  comment: Deletes the principal, so its memberships, API keys, tokens and access
    grants go too. Content that it made stays.
row_level_security:
  enabled: false

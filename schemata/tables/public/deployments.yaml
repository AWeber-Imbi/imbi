---
name: deployments
schema: public
owner: imbi_owner
comment: One rollout of a project into an environment. The release train, environment
  status and scoring read it. Replaces the graph Deployment node and the deployments
  array on DEPLOYED_TO edges.
columns:
- name: id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: Nanoid primary key. The application generates it. It does not change,
    so UI routes, API paths and other rows can refer to it.
- name: organization_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The organization that owns the row. Row-level security compares it with
    imbi.organization_id. Composite foreign keys include it, so a row cannot refer
    to a row in a different organization.
- name: project_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The project that was deployed.
- name: environment_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The target environment. An event for the same run with a different environment
    moves the row. It does not add a row.
- name: release_id
  data_type: TEXT
  collation: pg_catalog."C"
  comment: The release that the rollout shipped. NULL when a gateway event arrives
    before its release exists. The deployment sweep sets it later from release_tag
    or release_committish. A tagged release replaces an untagged one. Deleting the
    release sets it to NULL.
- name: origin
  data_type: TEXT
  nullable: false
  default: '''api''::text'
  comment: 'The writer that created the row, set once: api, gateway, promote, promote-watcher,
    sweeper, or migration for rows copied from the graph. It tells a promote rollout
    from a direct deploy.'
- name: deployment_status
  data_type: TEXT
  nullable: false
  comment: The current status. pending and in_progress are in flight; the sweeper
    closes in-flight rows that stay stuck. A cancelled run is failed.
- name: note
  data_type: TEXT
  comment: Free text from the writer, such as "resync via github" or "promote watch
    abandoned".
- name: external_run_id
  data_type: TEXT
  collation: pg_catalog."C"
  comment: The CI or CD run id. All writers that report the same run update one row.
    NULL when the writer has no run id; each such event then adds a row.
- name: external_run_url
  data_type: TEXT
  comment: A link to the run. NULL means unknown. A writer with no URL does not clear
    a URL that another writer recorded.
- name: performed_by
  data_type: TEXT
  comment: The deployer that the remote system reports, such as the GitHub deployment
    creator, or the user who asked for a promote. NULL when the operations log already
    records the actor. Replaces the PERFORMED edge.
- name: credential
  data_type: TEXT
  comment: The integration credential that ran the rollout when it was not the actor's
    own, such as "github-app installation 123". NULL when the principal used its
    own token.
- name: release_tag
  data_type: TEXT
  comment: The tag that a gateway event carried when release_id could not be resolved.
    The deployment sweep uses it first to find the release.
- name: release_committish
  data_type: TEXT
  collation: pg_catalog."C"
  comment: The commit that a gateway event carried when release_id could not be resolved.
    The sweep uses it when release_tag finds no release.
- name: history
  data_type: public.jsonb_array
  nullable: false
  default: '''[]''::jsonb'
  comment: Append-only list of {status, timestamp, source} objects, one per status
    change. A replay with the same status adds nothing. Status repair reads it to
    restore a status. JSONB because readers always read the whole list with the row.
- name: transitioned_at
  data_type: TIMESTAMP WITH TIME ZONE
  nullable: false
  comment: When the status last changed, from the provider clock when the writer
    passes a time. The application sets it, and changes it only when deployment_status
    changes. The newest deployment per environment is the one with the latest (transitioned_at,
    id). Replaces the graph updated_at, which the updated_at trigger cannot keep
    because it holds the provider time. The migration copies COALESCE(updated_at,
    created_at).
- name: created_at
  data_type: TIMESTAMP WITH TIME ZONE
  nullable: false
  default: CURRENT_TIMESTAMP
  comment: When the row was inserted. The database sets it.
- name: updated_at
  data_type: TIMESTAMP WITH TIME ZONE
  comment: When the row last changed. The set_updated_at trigger sets it on each
    UPDATE that changes the row. NULL until the first such UPDATE.
primary_key:
- id
storage_parameters:
  fillfactor: '90'
check_constraints:
- name: deployment_status_valid
  expression: (deployment_status = ANY (ARRAY['pending'::text, 'in_progress'::text,
    'success'::text, 'failed'::text, 'rolled_back'::text]))
- name: origin_valid
  expression: (origin = ANY (ARRAY['api'::text, 'gateway'::text, 'promote'::text,
    'promote-watcher'::text, 'sweeper'::text, 'migration'::text]))
foreign_keys:
- name: deployments_organization_id_fkey
  columns:
  - organization_id
  references:
    name: public.organizations
    columns:
    - id
  on_delete: RESTRICT
- name: deployments_project_id_fkey
  columns:
  - organization_id
  - project_id
  references:
    name: public.projects
    columns:
    - organization_id
    - id
  on_delete: CASCADE
- name: deployments_environment_id_fkey
  columns:
  - organization_id
  - environment_id
  references:
    name: public.environments
    columns:
    - organization_id
    - id
  on_delete: RESTRICT
- name: deployments_release_id_fkey
  columns:
  - organization_id
  - release_id
  references:
    name: public.releases
    columns:
    - organization_id
    - id
  on_delete: SET NULL
  on_delete_columns:
  - release_id
indexes:
- name: deployments_run_idx
  unique: true
  method: btree
  columns:
  - name: organization_id
  - name: project_id
  - name: external_run_id
  where: (external_run_id IS NOT NULL)
  comment: One row per external run of a project.
- name: deployments_release_idx
  method: btree
  columns:
  - name: organization_id
  - name: release_id
  where: (release_id IS NOT NULL)
- name: deployments_project_env_idx
  method: btree
  columns:
  - name: organization_id
  - name: project_id
  - name: environment_id
  - name: transitioned_at
  comment: The newest deployment per project and environment.
triggers:
- name: deployments_set_updated_at
  when: BEFORE
  events:
  - UPDATE
  for_each: ROW
  condition: (old.* IS DISTINCT FROM new.*)
  function: public.set_updated_at()
  comment: Sets updated_at on an UPDATE that changes the row. An UPDATE that changes
    nothing keeps it.
row_level_security:
  enabled: true
  forced: true
policies:
- name: organization_isolation
  using: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  with_check: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  comment: Rows are visible and writable only in the organization that the transaction
    sets in imbi.organization_id.

---
name: component_advisories
schema: public
owner: imbi_owner
comment: An advisory that an organization recorded against a component version. Component
  reports show it. Replaces the HAS_ADVISORY edge.
columns:
- name: organization_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The organization that owns the row. Row-level security compares it with
    imbi.organization_id. Composite foreign keys include it, so a row cannot refer
    to a row in a different organization.
- name: component_release_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The component version that the advisory affects.
- name: advisory_id
  data_type: TEXT
  nullable: false
  collation: pg_catalog."C"
  comment: The shared advisory row.
- name: url
  data_type: TEXT
  nullable: false
  comment: The advisory link that the reports show on the advisory chip. The API
    accepts only http and https URLs, because the UI renders it as a link. Recording
    the advisory again for this version changes it. In the graph, this value is on
    the shared Advisory node.
- name: title
  data_type: TEXT
  comment: A short title for the advisory. NULL when none was given. Recording the
    advisory again for this version changes it. In the graph, this value is on the
    shared Advisory node.
- name: created_by
  data_type: TEXT
  nullable: false
  comment: The user email or service account slug that recorded the link.
- name: created_at
  data_type: TIMESTAMP WITH TIME ZONE
  nullable: false
  default: CURRENT_TIMESTAMP
  comment: When the row was inserted. The database sets it.
- name: updated_at
  data_type: TIMESTAMP WITH TIME ZONE
  comment: When the row last changed. The set_updated_at trigger sets it on each
    UPDATE that changes the row. NULL until the first such UPDATE.
primary_key:
- organization_id
- component_release_id
- advisory_id
foreign_keys:
- name: component_advisories_organization_id_fkey
  columns:
  - organization_id
  references:
    name: public.organizations
    columns:
    - id
  on_delete: RESTRICT
- name: component_advisories_component_release_id_fkey
  columns:
  - component_release_id
  references:
    name: public.component_releases
    columns:
    - id
  on_delete: RESTRICT
- name: component_advisories_advisory_id_fkey
  columns:
  - advisory_id
  references:
    name: public.advisories
    columns:
    - id
  on_delete: RESTRICT
indexes:
- name: component_advisories_adv_idx
  method: btree
  columns:
  - name: advisory_id
triggers:
- name: component_advisories_set_updated_at
  when: BEFORE
  events:
  - UPDATE
  for_each: ROW
  condition: (old.* IS DISTINCT FROM new.*)
  function: public.set_updated_at()
  comment: Sets updated_at on an UPDATE that changes the row. An UPDATE that changes
    nothing keeps it.
row_level_security:
  enabled: true
  forced: true
policies:
- name: organization_isolation
  using: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  with_check: (organization_id = ( SELECT public.current_organization_id() AS current_organization_id))
  comment: Rows are visible and writable only in the organization that the transaction
    sets in imbi.organization_id.

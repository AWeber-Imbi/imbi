# Backing services for the test suites (local `moon run *:test` and CI).
# Ports are dynamically assigned; the `moon run root:services` task writes
# .env.test with the resolved URLs.
name: imbi-tests

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123"
      - "9000"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q 'Ok'"]

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.13.0
    ports:
      - "4317"
      - "16686"

  iggy:
    image: ghcr.io/aweber-imbi/iggy:0.9.0-edge.6-0
    ports:
      - "3000"
      - "8090"
      - "8092"
    environment:
      IGGY_ROOT_USERNAME: iggy
      IGGY_ROOT_PASSWORD: iggy
      IGGY_HTTP_ENABLED: true
      IGGY_HTTP_ADDRESS: 0.0.0.0:3000
      IGGY_HTTP_WEB_UI: true
      IGGY_SYSTEM_SHARDING_CPU_ALLOCATION: 1
      IGGY_SYSTEM_SHARDING_PIN_CORES: "false"
      IGGY_TCP_ENABLED: true
      IGGY_TCP_ADDRESS: 0.0.0.0:8090
      IGGY_WEBSOCKET_ENABLED: true
      IGGY_WEBSOCKET_ADDRESS: 0.0.0.0:8092
    cap_add:
      - SYS_NICE
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "iggy", "ping"]
      start_period: 15s
      start_interval: 2s
      interval: 60s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21.5
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 10

  ministack:
    image: ministackorg/ministack
    ports:
      - "4566"
    environment:
      SERVICES: s3
      DEBUG: "0"
    healthcheck:
      # The image dropped curl; use the interpreter it already runs on.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: ghcr.io/aweber-imbi/postgres:latest
    ports:
      - "5432"
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: imbi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      start_period: 30s

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 10

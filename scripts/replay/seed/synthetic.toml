# A synthetic organization for a proof of the replay without a
# production copy. Run it once on a new AGE-era database after
# `imbi-api setup` (organization `synthetic`):
#
#   uv run python -m scripts.replay scenarios --scenarios-dir scripts/replay/seed \
#     --var org_slug=synthetic --var admin_email=admin@example.com \
#     --base-url http://127.0.0.1:18009 --out ../replay-recordings/seed
#
# The steps do not clean up: the rows stay for `record`.

domain = "seed"
owner = "orchestrator"

[[scenario]]
name = "synthetic organization"
description = "teams, environments, project types, tags, projects with releases and documents, and a second organization"

[[scenario.step]]
name = "team 1"
method = "POST"
path = "/api/organizations/{org_slug}/teams/"
body = { name = "Team 1", slug = "team-1", description = "Synthetic team 1" }
expect = 201

[[scenario.step]]
name = "environment 1"
method = "POST"
path = "/api/organizations/{org_slug}/environments/"
body = { name = "Env 1", slug = "env-1", sort_order = 1 }
expect = 201

[[scenario.step]]
name = "project type 1"
method = "POST"
path = "/api/organizations/{org_slug}/project-types/"
body = { name = "Type 1", slug = "type-1", releasable = true }
expect = 201

[[scenario.step]]
name = "tag 1"
method = "POST"
path = "/api/organizations/{org_slug}/tags/"
body = { name = "Tag 1", slug = "tag-1" }

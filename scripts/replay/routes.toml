# How `record` builds the requests of each GET route.
#
# A route with no path parameter (other than a global variable such as
# `org_slug`) needs no entry: the recorder sends one request. Every
# other route needs an entry, with a `source` or a `skip` reason. The
# recorder stops when a route has neither (see `plan.py`).
#
# Sources run against the AGE-era database of the recording. `$name`
# in a query is the quoted value of a global variable. The columns of
# a source row bind the path and query parameters of the same name.
# Each query sorts its rows, so that two recordings of one database get
# the same requests.

graph = "imbi"

[globals]
sources = ["organization", "admin_email"]

# -- sources -----------------------------------------------------------

[sources.organization]
cypher = "MATCH (o:Organization) RETURN o.slug ORDER BY o.slug"
columns = ["org_slug"]

[sources.organization_as_slug]
cypher = "MATCH (o:Organization) RETURN o.slug ORDER BY o.slug"
columns = ["slug"]

# The user of the recording token (`token --dsn`), and the user that
# the scenarios add to a team.
[sources.admin_email]
cypher = '''
MATCH (u:User)-[:MEMBER_OF]->(:Organization)
WHERE u.is_admin = true AND u.is_active = true
RETURN u.email ORDER BY u.email'''
columns = ["admin_email"]

[sources.user]
cypher = '''
MATCH (u:User)-[:MEMBER_OF]->(:Organization {slug: $org_slug})
RETURN u.email ORDER BY u.email'''
columns = ["email"]

[sources.service_account]
cypher = "MATCH (s:ServiceAccount) RETURN s.slug ORDER BY s.slug"
columns = ["slug"]

[sources.user_identity]
cypher = '''
MATCH (:User)-[:HAS_IDENTITY]->(c:IdentityConnection),
      (i:Integration {id: c.integration_id})
RETURN i.slug, c.subject ORDER BY i.slug, c.subject'''
columns = ["integration_slug", "subject"]

[sources.team]
cypher = '''
MATCH (t:Team)-[:BELONGS_TO]->(:Organization {slug: $org_slug})
RETURN t.slug ORDER BY t.slug'''
columns = ["slug"]

[sources.environment]
cypher = '''
MATCH (e:Environment)-[:BELONGS_TO]->(:Organization {slug: $org_slug})
RETURN e.slug ORDER BY e.slug'''
columns = ["slug"]

[sources.environment_edge]
cypher = '''
MATCH (e:Environment)-[:BELONGS_TO]->(:Organization {slug: $org_slug})
RETURN e.slug, 'MAPS_TO' ORDER BY e.slug'''
columns = ["slug", "rel_type"]

[sources.link_definition]
cypher = '''
MATCH (l:LinkDefinition)-[:BELONGS_TO]->(:Organization {slug: $org_slug})
RETURN l.slug ORDER BY l.slug'''
columns = ["slug"]

[sources.project_type]
cypher = '''
MATCH (t:ProjectType)-[:BELONGS_TO]->(:Organization {slug: $org_slug})
RETURN t.slug ORDER BY t.slug'''
columns = ["slug"]

[sources.project_type_as_type_slug]
cypher = '''
MATCH (t:ProjectType)-[:BELONGS_TO]->(:Organization {slug: $org_slug})
RETURN t.slug ORDER BY t.slug'''
columns = ["type_slug"]

[sources.project]
cypher = '''
MATCH (p:Project)-[:OWNED_BY]->(:Team)
      -[:BELONGS_TO]->(:Organization {slug: $org_slug})
RETURN p.id ORDER BY p.id'''
columns = ["project_id"]

[sources.project_with_type]
cypher = '''
MATCH (p:Project)-[:OWNED_BY]->(:Team)
      -[:BELONGS_TO]->(:Organization {slug: $org_slug}),
      (p)-[:TYPE]->(t:ProjectType)
RETURN p.id, t.slug ORDER BY p.id, t.slug'''
columns = ["project_id", "project_type_slugs"]

[sources.project_ref]
cypher = '''
MATCH (p:Project)-[:OWNED_BY]->(:Team)
      -[:BELONGS_TO]->(:Organization {slug: $org_slug})
RETURN p.id, 'main' ORDER BY p.id'''
columns = ["project_id", "ref"]

[sources.release]
cypher = '''
MATCH (p:Project)-[:HAS_RELEASE]->(r:Release),
      (p)-[:OWNED_BY]->(:Team)
      -[:BELONGS_TO]->(:Organization {slug: $org_slug})
RETURN p.id, r.id ORDER BY p.id, r.id'''
columns = ["project_id", "release_id"]

[sources.release_tag]
cypher = '''
MATCH (p:Project)-[:HAS_RELEASE]->(r:Release),
      (p)-[:OWNED_BY]->(:Team)
      -[:BELONGS_TO]->(:Organization {slug: $org_slug})
RETURN p.id, r.tag ORDER BY p.id, r.tag'''
columns = ["project_id", "tag"]

[sources.release_committish]
cypher = '''
MATCH (p:Project)-[:HAS_RELEASE]->(r:Release),
      (p)-[:OWNED_BY]->(:Team)
      -[:BELONGS_TO]->(:Organization {slug: $org_slug})
RETURN p.id, r.committish ORDER BY p.id, r.committish'''
columns = ["project_id", "committish"]

[sources.release_environment]
cypher = '''
MATCH (p:Project)-[:HAS_RELEASE]->(r:Release)-[:HAS_DEPLOYMENT]->
      (:Deployment)-[:TARGETS]->(e:Environment),
      (p)-[:OWNED_BY]->(:Team)
      -[:BELONGS_TO]->(:Organization {slug: $org_slug})
RETURN DISTINCT p.id, r.id, e.slug ORDER BY p.id, r.id, e.slug'''
columns = ["project_id", "release_id", "env_slug"]

[sources.deployment_run]
cypher = '''
MATCH (p:Project)-[:HAS_RELEASE]->(:Release)-[:HAS_DEPLOYMENT]->
      (d:Deployment),
      (p)-[:OWNED_BY]->(:Team)
      -[:BELONGS_TO]->(:Organization {slug: $org_slug})
WHERE d.run_id IS NOT NULL
RETURN p.id, d.run_id ORDER BY p.id, d.run_id'''
columns = ["project_id", "run_id"]

[sources.integration]
cypher = '''
MATCH (i:Integration)-[:BELONGS_TO]->(:Organization {slug: $org_slug})
RETURN i.slug ORDER BY i.slug'''
columns = ["slug"]

[sources.integration_capability]
cypher = '''
MATCH ()-[u:USES]->(i:Integration)
      -[:BELONGS_TO]->(:Organization {slug: $org_slug})
RETURN DISTINCT i.slug, u.capability ORDER BY i.slug, u.capability'''
columns = ["slug", "kind"]

[sources.login_provider]
cypher = """
MATCH (i:Integration)
OPTIONAL MATCH (i)-[b:BELONGS_TO]->(:Organization)
WITH i, b WHERE b IS NULL
RETURN i.slug ORDER BY i.slug"""
columns = ["slug"]

[sources.webhook]
cypher = '''
MATCH (w:Webhook)-[:BELONGS_TO]->(:Organization {slug: $org_slug})
RETURN w.slug ORDER BY w.slug'''
columns = ["webhook"]

[sources.tag]
cypher = '''
MATCH (t:Tag)-[:BELONGS_TO]->(:Organization {slug: $org_slug})
RETURN t.slug ORDER BY t.slug'''
columns = ["tag_slug"]

[sources.document]
cypher = '''
MATCH (d:Document)-[:BELONGS_TO]->(:Organization {slug: $org_slug})
RETURN d.id ORDER BY d.id'''
columns = ["document_id"]

[sources.document_version]
cypher = '''
MATCH (d:Document)-[:BELONGS_TO]->(:Organization {slug: $org_slug})
RETURN d.id, '1' ORDER BY d.id'''
columns = ["document_id", "version"]

[sources.project_document]
cypher = '''
MATCH (d:Document)-[:ATTACHED_TO]->(p:Project)
RETURN p.id, d.id ORDER BY p.id, d.id'''
columns = ["project_id", "document_id"]

[sources.document_template]
cypher = '''
MATCH (t:DocumentTemplate)-[:BELONGS_TO]->(:Organization {slug: $org_slug})
RETURN t.slug ORDER BY t.slug'''
columns = ["slug"]

[sources.upload]
cypher = "MATCH (u:Upload) RETURN u.id ORDER BY u.id"
columns = ["upload_id"]

[sources.ai_provider]
cypher = '''
MATCH (p:AIProvider)-[:BELONGS_TO]->(:Organization {slug: $org_slug})
RETURN p.id ORDER BY p.id'''
columns = ["id"]

[sources.ai_model]
cypher = '''
MATCH (m:AIModel)-[:BELONGS_TO]->(:Organization {slug: $org_slug})
RETURN m.id ORDER BY m.id'''
columns = ["id"]

[sources.mcp_server]
cypher = "MATCH (m:MCPServer) RETURN m.id ORDER BY m.id"
columns = ["id"]

[sources.role]
cypher = "MATCH (r:Role) RETURN r.slug ORDER BY r.slug"
columns = ["slug"]

[sources.blueprint_type]
cypher = "MATCH (b:Blueprint) RETURN DISTINCT b.type ORDER BY b.type"
columns = ["type"]

[sources.blueprint]
cypher = "MATCH (b:Blueprint) RETURN b.type, b.slug ORDER BY b.type, b.slug"
columns = ["type", "slug"]

[sources.scoring_policy]
cypher = "MATCH (s:ScoringPolicy) RETURN s.slug ORDER BY s.slug"
columns = ["slug"]

[sources.component]
cypher = "MATCH (c:Component) RETURN c.id ORDER BY c.id"
columns = ["component_id"]

[sources.component_release]
cypher = "MATCH (c:ComponentRelease) RETURN c.id ORDER BY c.id"
columns = ["component_release_id"]

[sources.plugin]
rows = [
  { slug = "aws" },
  { slug = "github" },
  { slug = "google" },
  { slug = "logzio" },
  { slug = "oidc" },
  { slug = "pagerduty" },
  { slug = "sonarqube" },
]

[sources.plugin_edge]
rows = [{ slug = "aws", rel_type = "MAPS_TO" }]

[sources.plugin_label]
rows = [{ slug = "aws", label = "AwsAccount" }]

[sources.plugin_entity]
cypher = "MATCH (a:AwsAccount) RETURN 'aws', 'AwsAccount', a.id ORDER BY a.id"
columns = ["slug", "label", "id"]

[sources.maintenance_operation]
rows = [
  { slug = "commit-pushed-at-check" },
  { slug = "commit-pushed-at-repair" },
  { slug = "commit-sync" },
  { slug = "deployment-resync" },

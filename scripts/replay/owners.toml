# The agent that owns each route of the AGE-era API (execution plan,
# section 5). The diff groups the unexpected differences by these
# letters. A route that is not listed belongs to `default`.
#
# A module with "not in section 5" is not in the ownership table of
# the execution plan. Its letter is the owner of the code that the
# module calls. The orchestrator confirms these letters.
#
# When a Wave 2 agent adds a route, add it here. A moved route (D17)
# keeps its old path here: the diff keys every exchange by the old
# path.

default = "orchestrator"

[agents]
J = "tag pilot (WP1.7)"
K = "tenancy (WP2.1)"
L = "projects (WP2.2)"
M = "rbac (WP2.3)"
N = "releases (WP2.4, the release part)"
O = "deployments (WP2.4, the deployment part)"
P = "sbom (WP2.5)"
Q = "documents (WP2.6)"
R = "integrations (WP2.7)"
S = "ai (WP2.8)"
T = "plugins (WP2.9)"
U = "search (WP2.10)"
V = "cleanup (Wave 3)"
orchestrator = "no agent owns the route"

